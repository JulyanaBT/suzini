<!doctype html>
<html lang="fr">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#ffffff"
  >

  <title>
    Restauration | BT250 - Double Mixte
  </title>


  <link
    rel="stylesheet"
    href="assets/css/style.css"
  >


  <style>

    /* ========================================
       PAGE
    ======================================== */

    .food-page{
      padding-bottom:24px;
    }


    /* ========================================
       SOUS-NAV INFOS
       Toujours visible sur la largeur
    ======================================== */

    .infos-subnav{

      display:grid;

      grid-template-columns:
        repeat(4,minmax(0,1fr));

      gap:5px;

      padding:7px;

      border-radius:15px;

      background:#fff;

      box-shadow:
        0 8px 22px
        rgba(0,0,0,.07);
    }


    .infos-subnav a{

      display:flex;

      align-items:center;
      justify-content:center;

      min-width:0;

      padding:9px 4px;

      border-radius:999px;

      background:#eeeeee;

      color:#333;

      font-size:9px;
      font-weight:900;

      line-height:1;

      text-decoration:none;
      text-align:center;

      white-space:nowrap;
    }


    .infos-subnav a.active{

      background:#111;

      color:#fff;
    }


    /* ========================================
       PLACEHOLDER
    ======================================== */

    .food-placeholder{

      margin-top:8px;

      padding:28px 18px;

      border-radius:18px;

      background:
        linear-gradient(
          135deg,
          #ffe5e7,
          #fff8f8
        );

      border:
        1px solid
        rgba(199,60,80,.12);

      text-align:center;

      box-shadow:
        0 8px 22px
        rgba(0,0,0,.07);
    }


    .food-icon{

      font-size:42px;

      line-height:1;
    }


    .food-placeholder h2{

      margin:12px 0 0;

      color:#111;

      font-size:22px;
      font-weight:1000;

      line-height:1.1;
    }


    .food-placeholder p{

      max-width:400px;

      margin:8px auto 0;

      color:#666;

      font-size:12px;
      font-weight:750;

      line-height:1.45;
    }


    .coming-soon{

      display:inline-block;

      margin-top:14px;

      padding:6px 10px;

      border-radius:999px;

      background:#111;

      color:#fff;

      font-size:9px;
      font-weight:950;

      letter-spacing:.6px;

      text-transform:uppercase;
    }


    /* ========================================
       TABLETTE
    ======================================== */

    @media(min-width:760px){

      .infos-subnav a{

        padding:10px 8px;

        font-size:10px;
      }

    }

  </style>

</head>


<body
  data-page="infos"
  data-title="BT250 - Double Mixte"
  data-date="02 octobre 2026"
>


<div id="siteHeader"></div>


<main class="container food-page">


  <!-- ======================================
       SOUS-NAVIGATION INFOS
  ======================================= -->

  <nav
    class="infos-subnav"
    aria-label="Informations pratiques"
  >

    <a href="reglement.html">
      📜 Règlement
    </a>


    <a
      href="restauration.html"
      class="active"
      aria-current="page"
    >
      🍔 Restauration
    </a>


    <a href="acces.html">
      📍 Accès
    </a>


    <a href="contacts.html">
      ☎️ Contacts
    </a>

  </nav>


  <!-- ======================================
       PLACEHOLDER
  ======================================= -->

  <section class="food-placeholder">


    <div class="food-icon">
      🍔
    </div>


    <h2>
      Informations à venir
    </h2>


    <p>
      Les informations concernant la restauration
      et les boissons disponibles pendant le tournoi
      seront publiées prochainement.
    </p>


    <span class="coming-soon">
      Mise à jour prochaine
    </span>


  </section>


</main>


<!-- ======================================
     HEADER
======================================= -->

<script
  type="module"
  src="assets/js/header-tournament.js"
></script>


<!-- ======================================
     I ♥ MARINE
======================================= -->

<script
  type="module"
  src="assets/js/support-note.js"
></script>


<!-- ======================================
     MAINTENANCE
======================================= -->

<script
  type="module"
  src="assets/js/maintenance-guard.js"
></script>


</body>

</html>
