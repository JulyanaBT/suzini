<!doctype html>
<html lang="fr">

<head>

  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <title>BT250 Suzini — Double Mixte | Tournoi de rentrée</title>

  <link
    rel="stylesheet"
    href="assets/css/style.css"
  />


  <style>

    main{
      padding-top:0;
      padding-bottom:24px;
    }

    .section{
      margin-top:10px;
    }

    .section:first-child{
      margin-top:0;
    }


    /* ==============================
       BANDEAU HAUT
    ============================== */

    .top-strip{
      border-radius:0 0 24px 24px;
      padding:12px 14px;
      text-align:center;
      color:#fff;
      background:linear-gradient(135deg,#ff3e8a,#063b72);
      box-shadow:0 12px 28px rgba(16,24,40,.14);
    }

    .top-title{
      margin:0;
      font-size:20px;
      font-weight:1000;
      line-height:1;
      text-transform:uppercase;
    }

    .top-sub{
      margin:6px 0 0;
      font-size:14px;
      font-weight:900;
      font-style:italic;
    }


    /* ==============================
       CARTE PRINCIPALE
    ============================== */

    .main-card{
      display:grid;
      gap:10px;
      border-radius:22px;
      padding:16px;
      background:#ff3e8a;
      color:#fff;
      box-shadow:0 10px 22px rgba(16,24,40,.12);
    }

    .main-card.live{
      background:#ffd84d;
      color:#102033;
    }

    .main-card.finished{
      background:#063b72;
      color:#fff;
    }

    .card-top{
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:flex-start;
    }

    .big-date{
      font-size:52px;
      line-height:.82;
      font-weight:1000;
      letter-spacing:-.06em;
    }

    .status-pill{
      padding:7px 11px;
      border-radius:999px;
      background:#0b7a3b;
      color:#fff;
      font-size:12px;
      font-weight:1000;
      white-space:nowrap;
    }

    .status-pill.live{
      background:#102033;
      color:#ffd84d;
    }

    .status-pill.finished{
      background:#fff;
      color:#063b72;
    }

    .kicker{
      font-size:13px;
      font-weight:1000;
      text-transform:uppercase;
      letter-spacing:.08em;
    }

    .main-title{
      margin:0;
      font-size:32px;
      line-height:.95;
      font-weight:1000;
      letter-spacing:-.04em;
    }

    .main-text{
      font-size:15px;
      line-height:1.25;
      font-weight:900;
    }


    /* ==============================
       BOUTONS
    ============================== */

    .action-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
    }

    .action-btn{
      min-height:46px;
      border-radius:16px;
      padding:10px 12px;
      background:#fff;
      color:#063b72;
      font-size:14px;
      font-weight:1000;
      text-align:center;
      display:flex;
      align-items:center;
      justify-content:center;
      text-decoration:none;
    }

    .action-btn.primary{
      background:linear-gradient(180deg,#ffd84d,#f3b800);
      color:#102033;
    }

    .live .action-btn.primary{
      background:#063b72;
      color:#fff;
    }


    /* ==============================
       CARTES SECONDAIRES
    ============================== */

    .mini-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
    }

    .mini-card{
      border-radius:18px;
      padding:12px;
      min-height:86px;
      color:#fff;
      display:grid;
      align-content:center;
      gap:4px;
      text-decoration:none;
      box-shadow:0 8px 18px rgba(16,24,40,.10);
    }

    .mini-card.blue{
      background:#063b72;
    }

    .mini-card.pink{
      background:#ff3e8a;
    }

    .mini-card.yellow{
      background:#ffd84d;
      color:#102033;
    }

    .mini-card.green{
      background:#0b7a3b;
    }

    .compact-mini{
      min-height:70px;
      padding:10px;
    }

    .compact-mini .mini-title{
      font-size:17px;
    }

    .compact-mini .mini-text{
      font-size:11px;
    }

    .mini-kicker{
      font-size:11px;
      font-weight:1000;
      text-transform:uppercase;
      letter-spacing:.08em;
      opacity:.9;
    }

    .mini-title{
      font-size:20px;
      line-height:1;
      font-weight:1000;
    }

    .mini-text{
      font-size:12px;
      line-height:1.2;
      font-weight:900;
      opacity:.95;
    }

    .compact-panel{
      padding:12px;
      border-radius:22px;
    }

    .section-title{
      margin:0 0 8px;
      font-size:24px;
      line-height:.95;
      color:#fff;
      font-weight:1000;
      letter-spacing:-.04em;
      text-transform:uppercase;
    }


    /* ==============================
       RESPONSIVE
    ============================== */

    @media(max-width:759px){

      #secondaryGrid{
        grid-template-columns:1fr 1fr 1fr;
      }

      .compact-mini{
        min-height:68px;
      }

      .compact-mini .mini-kicker{
        font-size:9px;
      }

      .compact-mini .mini-title{
        font-size:15px;
      }

      .compact-mini .mini-text{
        font-size:10px;
      }

    }

    @media(min-width:760px){

      .top-strip{
        padding:16px 18px;
      }

      .main-card{
        grid-template-columns:1.2fr .8fr;
        align-items:center;
      }

      .mini-grid{
        grid-template-columns:repeat(3,1fr);
      }

    }

  </style>

</head>


<body
  data-page="accueil"
  data-type="double-mixte"
  data-title="BT250 Suzini - Double Mixte"
  data-date="02 octobre 2026"
>


<div id="siteHeaderEtape"></div>


<main class="container">


  <!-- ==============================
       TITRE
  ============================== -->

  <section class="section">

    <div class="top-strip">

      <h1 class="top-title">
        🎾 BT250 Suzini — Double Mixte
      </h1>

      <p class="top-sub">
        🏆 Tournoi de rentrée
      </p>

    </div>

  </section>


  <!-- ==============================
       CARTE PRINCIPALE
  ============================== -->

  <section class="section">

    <div
      id="mainCard"
      class="main-card"
    >

      <div>

        <div class="card-top">

          <div>

            <div class="big-date">
              02/10
            </div>

            <div class="kicker">
              Tournoi de rentrée
            </div>

          </div>

          <div
            id="statusPill"
            class="status-pill"
          >
            Inscriptions ouvertes
          </div>

        </div>


        <h2
          id="mainTitle"
          class="main-title"
        >
          Double mixte BT250
        </h2>


        <div
          id="mainText"
          class="main-text"
        >
          TC Suzini • Début 18h00 • 10 € / joueur •
          <span id="teamCount">0</span>/12 équipes.
        </div>

      </div>


      <div
        id="mainActions"
        class="action-grid"
      ></div>

    </div>

  </section>


  <!-- ==============================
       SUIVI TOURNOI
  ============================== -->

  <section class="section">

    <div class="summer-panel compact-panel">

      <h2
        id="secondaryTitle"
        class="section-title"
      >
        Suivre le tournoi
      </h2>

      <div
        id="secondaryGrid"
        class="mini-grid"
      ></div>

    </div>

  </section>


</main>


<script
  type="module"
  src="assets/js/header-etape.js"
></script>

<script
  type="module"
  src="assets/js/maintenance-guard-etape.js"
></script>


<script type="module">

  import { db }
  from "./assets/js/firebase.js?v=rentree-2026-index-1";


  import {

    doc,
    collection,
    onSnapshot

  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";


  /* ==============================
     CONFIGURATION TOURNOI
  ============================== */

  const EVENT_ID = "suzini-rentree-2026";
  const STEP_ID = "bt250-double-mixte";

  const MAX_TEAMS = 12;

  const WHATSAPP_GROUP_URL =
    "https://chat.whatsapp.com/Kk8uAXuZplX1Tw0g2rHtp6?s=em&p=i&mlu=0&ilr=0";


  /* ==============================
     ÉLÉMENTS DOM
  ============================== */

  const mainCard =
    document.getElementById("mainCard");

  const statusPill =
    document.getElementById("statusPill");

  const mainTitle =
    document.getElementById("mainTitle");

  const mainText =
    document.getElementById("mainText");

  const teamCount =
    document.getElementById("teamCount");

  const mainActions =
    document.getElementById("mainActions");

  const secondaryTitle =
    document.getElementById("secondaryTitle");

  const secondaryGrid =
    document.getElementById("secondaryGrid");


  /* ==============================
     FIRESTORE
  ============================== */

  const teamsRef =
    collection(
      db,
      "events",
      EVENT_ID,
      "steps",
      STEP_ID,
      "teams"
    );

  const statusRef =
    doc(
      db,
      "events",
      EVENT_ID,
      "steps",
      STEP_ID,
      "config",
      "status"
    );

  const programmationRef =
    doc(
      db,
      "events",
      EVENT_ID,
      "steps",
      STEP_ID,
      "config",
      "programmation"
    );


  let teamsCountValue = 0;

  let manualState = null;

  let programmationVisible = false;


  /* ==============================
     ÉTAT DU TOURNOI
  ============================== */

  function currentState(){

    if(manualState === "finished"){
      return "finished";
    }

    if(manualState === "live"){
      return "live";
    }

    if(programmationVisible){
      return "live";
    }

    return "registration";

  }


  /* ==============================
     AFFICHAGE
  ============================== */

  function render(){

    const state = currentState();

    teamCount.textContent =
      String(teamsCountValue);

    mainCard.className =
      "main-card";

    statusPill.className =
      "status-pill";


    /* ------------------------------
       INSCRIPTIONS
    ------------------------------ */

    if(state === "registration"){

      statusPill.textContent =
        "🟢 Inscriptions ouvertes";

      mainTitle.textContent =
        "Double mixte BT250";

      mainText.innerHTML =
        `TC Suzini • Début 18h00 • 10 € / joueur • ${teamsCountValue}/${MAX_TEAMS} équipes.`;


      mainActions.innerHTML = `

        <a
          class="action-btn primary"
          href="inscriptions.html"
        >
          📝 S’inscrire
        </a>

        <a
          class="action-btn"
          href="participants.html"
        >
          👥 Équipes
        </a>

        <a
          class="action-btn"
          href="reglement.html"
        >
          📖 Règlement
        </a>

        <a
          class="action-btn"
          href="paiement.html"
        >
          💳 Paiement
        </a>

      `;


      secondaryTitle.textContent =
        "Suivre le tournoi";


      secondaryGrid.innerHTML = `

        <a
          class="mini-card blue compact-mini"
          href="programmation.html"
        >

          <div class="mini-kicker">
            À venir
          </div>

          <div class="mini-title">
            Planning
          </div>

          <div class="mini-text">
            Après clôture.
          </div>

        </a>


        <a
          class="mini-card yellow compact-mini"
          href="classement.html"
        >

          <div class="mini-kicker">
            Résultats
          </div>

          <div class="mini-title">
            Classement
          </div>

          <div class="mini-text">
            Pendant tournoi.
          </div>

        </a>


        <a
          class="mini-card green compact-mini"
          href="${WHATSAPP_GROUP_URL}"
          target="_blank"
          rel="noopener"
        >

          <div class="mini-kicker">
            Infos live
          </div>

          <div class="mini-title">
            WhatsApp
          </div>

          <div class="mini-text">
            Rejoindre.
          </div>

        </a>

      `;

      return;

    }


    /* ------------------------------
       TOURNOI EN COURS
    ------------------------------ */

    if(state === "live"){

      mainCard.classList.add("live");

      statusPill.classList.add("live");

      statusPill.textContent =
        "🟡 Tournoi en cours";

      mainTitle.textContent =
        "Suivre les matchs";

      mainText.innerHTML =
        `${teamsCountValue}/${MAX_TEAMS} équipes • programmation publiée • résultats en direct.`;


      mainActions.innerHTML = `

        <a
          class="action-btn primary"
          href="programmation.html"
        >
          📅 Programmation
        </a>

        <a
          class="action-btn"
          href="classement.html"
        >
          🏆 Classement
        </a>

        <a
          class="action-btn"
          href="participants.html"
        >
          👥 Équipes
        </a>

        <a
          class="action-btn"
          href="reglement.html"
        >
          📖 Règlement
        </a>

      `;


      secondaryTitle.textContent =
        "Infos utiles";


      secondaryGrid.innerHTML = `

        <a
          class="mini-card green compact-mini"
          href="${WHATSAPP_GROUP_URL}"
          target="_blank"
          rel="noopener"
        >

          <div class="mini-kicker">
            Infos live
          </div>

          <div class="mini-title">
            WhatsApp
          </div>

          <div class="mini-text">
            Rejoindre.
          </div>

        </a>


        <a
          class="mini-card pink compact-mini"
          href="restauration.html"
        >

          <div class="mini-kicker">
            Sur place
          </div>

          <div class="mini-title">
            Resto
          </div>

          <div class="mini-text">
            Repas boissons.
          </div>

        </a>


        <a
          class="mini-card blue compact-mini"
          href="paiement.html"
        >

          <div class="mini-kicker">
            Paiement
          </div>

          <div class="mini-title">
            Infos
          </div>

          <div class="mini-text">
            Si besoin.
          </div>

        </a>

      `;

      return;

    }


    /* ------------------------------
       TOURNOI TERMINÉ
    ------------------------------ */

    mainCard.classList.add("finished");

    statusPill.classList.add("finished");

    statusPill.textContent =
      "🔵 Tournoi terminé";

    mainTitle.textContent =
      "Classement final";

    mainText.innerHTML =
      `${teamsCountValue}/${MAX_TEAMS} équipes • merci à tous les participants.`;


    mainActions.innerHTML = `

      <a
        class="action-btn primary"
        href="classement.html"
      >
        🏆 Classement final
      </a>

      <a
        class="action-btn"
        href="programmation.html"
      >
        📅 Résultats
      </a>

      <a
        class="action-btn"
        href="participants.html"
      >
        👥 Équipes
      </a>

      <a
        class="action-btn"
        href="reglement.html"
      >
        📖 Règlement
      </a>

    `;


    secondaryTitle.textContent =
      "Autres informations";


    secondaryGrid.innerHTML = `

      <a
        class="mini-card green compact-mini"
        href="${WHATSAPP_GROUP_URL}"
        target="_blank"
        rel="noopener"
      >

        <div class="mini-kicker">
          Groupe
        </div>

        <div class="mini-title">
          WhatsApp
        </div>

        <div class="mini-text">
          Infos BT.
        </div>

      </a>


      <a
        class="mini-card pink compact-mini"
        href="restauration.html"
      >

        <div class="mini-kicker">
          Sur place
        </div>

        <div class="mini-title">
          Resto
        </div>

        <div class="mini-text">
          Infos pratiques.
        </div>

      </a>

    `;

  }


  /* ==============================
     ÉCOUTE FIRESTORE
  ============================== */

  onSnapshot(

    teamsRef,

    (snap) => {

      teamsCountValue =
        snap.size;

      render();

    },

    () => render()

  );


  onSnapshot(

    statusRef,

    (snap) => {

      const data =
        snap.exists()
          ? snap.data()
          : {};

      manualState =
        data.state || null;

      render();

    },

    () => render()

  );


  onSnapshot(

    programmationRef,

    (snap) => {

      const data =
        snap.exists()
          ? snap.data()
          : {};

      programmationVisible =
        data.publicVisible === true;

      render();

    },

    () => render()

  );


  render();

</script>


</body>

</html>
