<!doctype html>
<html lang="fr">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#ffffff"
  >

  <title>
    Équipes | BT250 - Double Mixte
  </title>


  <link
    rel="stylesheet"
    href="assets/css/style.css"
  >


  <style>

    /* ========================================
       PAGE ÉQUIPES
    ======================================== */

    .teams-page{
      padding-bottom:18px;
    }


    /* ========================================
       RÉSUMÉ
    ======================================== */

    .summary-grid{
      display:grid;

      grid-template-columns:
        repeat(3,minmax(0,1fr));

      gap:7px;

      margin-bottom:8px;
    }


    .summary-box{
      min-width:0;

      padding:11px 7px;

      border-radius:14px;

      background:white;

      text-align:center;

      box-shadow:
        0 8px 22px rgba(0,0,0,.06);
    }


    .summary-box strong{
      display:block;

      color:#101010;

      font-size:23px;

      line-height:1;

      font-weight:1000;
    }


    .summary-box span{
      display:block;

      margin-top:4px;

      color:#777;

      font-size:8px;

      font-weight:900;

      letter-spacing:.7px;

      text-transform:uppercase;
    }


    .summary-box.confirmed strong{
      color:#16723c;
    }


    .summary-box.remaining strong{
      color:var(--orange);
    }


    /* ========================================
       BLOC LISTE
    ======================================== */

    .teams-block{
      padding:14px;

      border-radius:17px;

      background:white;

      border-top:
        4px solid var(--orange);

      box-shadow:
        0 8px 22px rgba(0,0,0,.07);
    }


    .list-head{
      display:flex;

      align-items:center;

      justify-content:space-between;

      gap:10px;

      margin-bottom:10px;
    }


    .list-head-left{
      min-width:0;
    }


    .list-title{
      margin:0;

      font-size:17px;

      line-height:1;

      font-weight:950;
    }


    .list-sub{
      margin:4px 0 0;

      color:#777;

      font-size:10px;

      line-height:1.3;
    }


    .count-badge{
      flex:0 0 auto;

      min-width:32px;

      padding:5px 8px;

      border-radius:999px;

      background:#fff0ec;

      color:var(--orange-dark);

      text-align:center;

      font-size:12px;

      font-weight:950;
    }


    /* ========================================
       LISTE ÉQUIPES
    ======================================== */

    .teams-list{
      display:grid;

      grid-template-columns:1fr;

      gap:8px;
    }


    /* ========================================
       CARTE ÉQUIPE
    ======================================== */

    .team-card{
      min-width:0;

      padding:12px;

      border-radius:15px;

      background:#f7f7f7;

      border:
        1px solid #eeeeee;
    }


    .team-top{
      display:flex;

      align-items:flex-start;

      justify-content:space-between;

      gap:10px;

      margin-bottom:9px;
    }


    .team-heading{
      min-width:0;
    }


    .team-number{
      display:block;

      margin-bottom:2px;

      color:var(--orange);

      font-size:8px;

      font-weight:900;

      letter-spacing:.8px;

      text-transform:uppercase;
    }


    .team-name{
      overflow:hidden;

      color:#101010;

      font-size:17px;

      line-height:1.05;

      font-weight:950;

      text-overflow:ellipsis;

      white-space:nowrap;
    }


    /* ========================================
       STATUT
    ======================================== */

    .team-status{
      flex:0 0 auto;

      padding:5px 7px;

      border-radius:999px;

      background:#eeeeee;

      color:#666;

      font-size:8px;

      font-weight:950;

      text-transform:uppercase;
    }


    .team-status.confirmed{
      background:#ddf7e7;

      color:#16723c;
    }


    .team-status.registered{
      background:#e4f7fc;

      color:#155f75;
    }


    /* ========================================
       JOUEURS
    ======================================== */

    .team-players{
      display:grid;

      grid-template-columns:
        repeat(2,minmax(0,1fr));

      gap:6px;
    }


    .player-chip{
      min-width:0;

      min-height:48px;

      padding:8px 9px;

      border-radius:12px;

      background:white;

      display:flex;

      align-items:center;

      gap:7px;

      box-shadow:
        0 2px 8px rgba(0,0,0,.04);
    }


    .player-icon{
      width:28px;

      height:28px;

      flex:0 0 28px;

      display:flex;

      align-items:center;

      justify-content:center;

      border-radius:9px;

      font-size:14px;
    }


    .player-chip.woman .player-icon{
      background:#fff0f4;
    }


    .player-chip.man .player-icon{
      background:#eaf7fb;
    }


    .player-info{
      min-width:0;
    }


    .player-name{
      display:block;

      overflow:hidden;

      color:#222;

      font-size:11px;

      line-height:1.1;

      font-weight:900;

      text-overflow:ellipsis;

      white-space:nowrap;
    }


    .player-rank{
      display:block;

      margin-top:3px;

      color:#888;

      font-size:8px;

      font-weight:800;

      text-transform:uppercase;
    }


    /* ========================================
       POIDS ÉQUIPE
    ======================================== */

    .team-ranking{
      display:flex;

      align-items:center;

      justify-content:space-between;

      gap:8px;

      margin-top:7px;

      padding-top:7px;

      border-top:
        1px solid #e8e8e8;

      color:#888;

      font-size:8px;

      font-weight:850;

      text-transform:uppercase;
    }


    .team-ranking strong{
      color:#333;

      font-size:10px;

      font-weight:950;
    }


    /* ========================================
       VIDE
    ======================================== */

    .empty{
      padding:14px;

      border-radius:12px;

      background:#f5f5f5;

      color:#808080;

      text-align:center;

      font-size:11px;

      font-weight:800;
    }


    /* ========================================
       NOTE
    ======================================== */

    .teams-note{
      margin-top:8px;

      padding:11px 13px;

      border-radius:14px;

      background:#e4f7fc;

      color:#155f75;

      font-size:10px;

      line-height:1.4;

      font-weight:700;
    }


    /* ========================================
       BOUTON INSCRIPTION
    ======================================== */

    .signup-link{
      display:flex;

      align-items:center;

      justify-content:center;

      min-height:47px;

      margin-top:8px;

      padding:10px 12px;

      border-radius:14px;

      background:var(--orange);

      color:white;

      font-size:13px;

      font-weight:950;

      text-align:center;

      text-decoration:none;

      box-shadow:
        0 6px 16px rgba(255,75,39,.18);
    }


    .signup-link:active{
      transform:scale(.985);
    }


    /* ========================================
       REMERCIEMENT
    ======================================== */

    .support-note{
      margin:12px 0 4px;

      color:#999;

      font-size:9px;

      font-style:italic;

      font-weight:600;

      text-align:center;
    }


    .support-note .heart{
      color:#e53935;

      font-style:normal;
    }


    /* ========================================
       RESPONSIVE
    ======================================== */

    @media(min-width:560px){

      .teams-list{
        grid-template-columns:
          1fr 1fr;
      }

    }


    @media(max-width:350px){

      .team-players{
        grid-template-columns:1fr;
      }

    }

  </style>

</head>


<body
  data-page="participants"
  data-title="BT250 - Double Mixte"
  data-date="02 octobre 2026"
>


<div id="siteHeader"></div>


<main class="container teams-page">


  <!-- ======================================
       RÉSUMÉ
  ======================================= -->

  <section class="summary-grid">


    <div class="summary-box">

      <strong id="countTotal">
        0
      </strong>

      <span>
        Équipes
      </span>

    </div>


    <div class="summary-box confirmed">

      <strong id="countConfirmed">
        0
      </strong>

      <span>
        Confirmées
      </span>

    </div>


    <div class="summary-box remaining">

      <strong id="countRemaining">
        12
      </strong>

      <span>
        Places
      </span>

    </div>


  </section>



  <!-- ======================================
       LISTE
  ======================================= -->

  <section class="teams-block">


    <div class="list-head">

      <div class="list-head-left">

        <h2 class="list-title">
          🎾 Tableau des équipes
        </h2>


        <p class="list-sub">
          Maximum 12 équipes.
        </p>

      </div>


      <div class="count-badge">

        <span id="listCount">
          0
        </span>

      </div>

    </div>


    <div
      id="teamsList"
      class="teams-list"
    >

      <div class="empty">
        Chargement des équipes…
      </div>

    </div>


  </section>



  <!-- ======================================
       INSCRIPTION
  ======================================= -->

  <a
    id="signupLink"
    class="signup-link"
    href="inscriptions.html"
  >
    ✍️ Inscrire une équipe
  </a>



  <!-- ======================================
       NOTE
  ======================================= -->

  <section class="teams-note">

    ℹ️ Les classements affichés sont indicatifs
    et peuvent être ajustés par l'organisation
    avant le tirage.

  </section>



  <!-- ======================================
       REMERCIEMENT
  ======================================= -->

  <div class="support-note">
    Merci au support de I
    <span class="heart">♥</span>
    Marine
  </div>


</main>



<!-- ======================================
     HEADER
======================================= -->

<script
  type="module"
  src="assets/js/header-tournament.js"
></script>



<!-- ======================================
     FIRESTORE
======================================= -->

<script type="module">

  import {
    db
  } from "./assets/js/firebase.js";


  import {
    collection,
    onSnapshot,
    query,
    orderBy
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";


  /* ========================================
     CONFIGURATION
  ======================================== */

  const EVENT_ID =
    "suzini-bt250-mixte-2026-10-02";


  const MAX_TEAMS =
    12;


  /* ========================================
     ÉLÉMENTS
  ======================================== */

  const teamsList =
    document.getElementById(
      "teamsList"
    );


  const countTotal =
    document.getElementById(
      "countTotal"
    );


  const countConfirmed =
    document.getElementById(
      "countConfirmed"
    );


  const countRemaining =
    document.getElementById(
      "countRemaining"
    );


  const listCount =
    document.getElementById(
      "listCount"
    );


  const signupLink =
    document.getElementById(
      "signupLink"
    );


  /* ========================================
     FIRESTORE
  ======================================== */

  const teamsRef =
    collection(
      db,
      "events",
      EVENT_ID,
      "teams"
    );


  /* ========================================
     OUTILS
  ======================================== */

  function esc(value){

    return String(value || "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");

  }


  function toNum(value){

    if(
      value === null ||
      value === undefined ||
      value === ""
    ){

      return null;

    }


    const number =
      Number(
        String(value)
          .replace(",",".")
          .trim()
      );


    return Number.isFinite(number)
      ? number
      : null;

  }


  function fmtRank(value){

    const number =
      toNum(value);


    return number === null
      ? "—"
      : String(number);

  }


  function playerShort(player){

    const prenom =
      String(
        player?.prenom || ""
      ).trim() || "Joueur";


    const nom =
      String(
        player?.nom || ""
      ).trim();


    const initial =
      nom
        ? ` ${nom.charAt(0).toUpperCase()}.`
        : "";


    return (
      `${prenom}${initial}`
    );

  }


  function playerRank(
    player,
    fallback
  ){

    return (
      player?.rank ??
      fallback ??
      null
    );

  }


  /* ========================================
     POIDS ÉQUIPE
  ======================================== */

  function teamRank(team){

    const woman =
      team.woman ||
      team.player1 ||
      {};


    const man =
      team.man ||
      team.player2 ||
      {};


    const womanRank =
      toNum(
        playerRank(
          woman,
          team.p1Rank
        )
      );


    const manRank =
      toNum(
        playerRank(
          man,
          team.p2Rank
        )
      );


    if(
      womanRank === null ||
      manRank === null
    ){

      return null;

    }


    return (
      womanRank +
      manRank
    );

  }


  /* ========================================
     VISIBILITÉ
  ======================================== */

  function isVisibleTeam(team){

    return (

      team.status !==
        "deleted"

      &&

      team.status !==
        "cancelled"

      &&

      team.status !==
        "refused"

      &&

      team.stby !==
        true

      &&

      team.list !==
        "wait"

    );

  }


  /* ========================================
     STATUT
  ======================================== */

  function statusLabel(team){

    if(
      team.status ===
      "confirmed"
    ){

      return {
        label:"Confirmée",
        css:"confirmed"
      };

    }


    return {
      label:"Inscrite",
      css:"registered"
    };

  }


  /* ========================================
     CARTE ÉQUIPE
  ======================================== */

  function teamCard(
    team,
    index
  ){

    const woman =
      team.woman ||
      team.player1 ||
      {};


    const man =
      team.man ||
      team.player2 ||
      {};


    const teamName =
      team.teamName ||
      `${woman.prenom || "Joueuse"} & ${man.prenom || "Joueur"}`;


    const womanRank =
      playerRank(
        woman,
        team.p1Rank
      );


    const manRank =
      playerRank(
        man,
        team.p2Rank
      );


    const rank =
      teamRank(
        team
      );


    const status =
      statusLabel(
        team
      );


    const rankingHtml =
      rank === null

        ? ""

        : `

          <div class="team-ranking">

            <span>
              Poids équipe
            </span>

            <strong>
              ${esc(
                fmtRank(rank)
              )}
            </strong>

          </div>

        `;


    return `

      <article class="team-card">


        <div class="team-top">


          <div class="team-heading">

            <span class="team-number">
              Équipe ${index + 1}
            </span>


            <div class="team-name">
              ${esc(teamName)}
            </div>

          </div>


          <span
            class="team-status ${status.css}"
          >
            ${status.label}
          </span>


        </div>



        <div class="team-players">


          <div class="player-chip woman">

            <span class="player-icon">
              👩
            </span>


            <div class="player-info">

              <span class="player-name">
                ${esc(
                  playerShort(
                    woman
                  )
                )}
              </span>


              <span class="player-rank">
                Cl. ${esc(
                  fmtRank(
                    womanRank
                  )
                )}
              </span>

            </div>

          </div>



          <div class="player-chip man">

            <span class="player-icon">
              👨
            </span>


            <div class="player-info">

              <span class="player-name">
                ${esc(
                  playerShort(
                    man
                  )
                )}
              </span>


              <span class="player-rank">
                Cl. ${esc(
                  fmtRank(
                    manRank
                  )
                )}
              </span>

            </div>

          </div>


        </div>


        ${rankingHtml}


      </article>

    `;

  }


  /* ========================================
     ÉCOUTE FIRESTORE
  ======================================== */

  onSnapshot(

    query(
      teamsRef,
      orderBy(
        "createdAt",
        "asc"
      )
    ),

    snapshot => {


      const teams =
        snapshot.docs

          .map(
            documentSnapshot => ({

              id:
                documentSnapshot.id,

              ...documentSnapshot.data()

            })
          )

          .filter(
            isVisibleTeam
          )

          .sort(
            (a,b) => {


              const aRank =
                teamRank(a);


              const bRank =
                teamRank(b);


              const aValue =
                aRank === null
                  ? Number.POSITIVE_INFINITY
                  : aRank;


              const bValue =
                bRank === null
                  ? Number.POSITIVE_INFINITY
                  : bRank;


              if(
                aValue !==
                bValue
              ){

                return (
                  aValue -
                  bValue
                );

              }


              const aTime =
                a.createdAt?.seconds ||
                0;


              const bTime =
                b.createdAt?.seconds ||
                0;


              return (
                aTime -
                bTime
              );

            }
          );


      /* ====================================
         COMPTEURS
      ==================================== */

      const total =
        teams.length;


      const confirmed =
        teams.filter(
          team =>
            team.status ===
            "confirmed"
        ).length;


      const remaining =
        Math.max(
          0,
          MAX_TEAMS - total
        );


      countTotal.textContent =
        String(total);


      countConfirmed.textContent =
        String(confirmed);


      countRemaining.textContent =
        String(remaining);


      listCount.textContent =
        String(total);


      /* ====================================
         TOURNOI COMPLET
      ==================================== */

      if(
        total >=
        MAX_TEAMS
      ){

        signupLink.textContent =
          "🎾 Tableau complet";


        signupLink.style.background =
          "#777";


        signupLink.style.pointerEvents =
          "none";


        signupLink.removeAttribute(
          "href"
        );

      }

      else{

        signupLink.textContent =
          "✍️ Inscrire une équipe";


        signupLink.style.background =
          "";


        signupLink.style.pointerEvents =
          "";


        signupLink.href =
          "inscriptions.html";

      }


      /* ====================================
         AFFICHAGE
      ==================================== */

      teamsList.innerHTML =
        total

          ? teams
              .map(
                teamCard
              )
              .join("")

          : `

              <div class="empty">
                Aucune équipe inscrite
                pour le moment.
              </div>

            `;

    },


    error => {

      console.error(
        error
      );


      teamsList.innerHTML = `

        <div class="empty">
          Impossible de charger
          les équipes.
        </div>

      `;

    }

  );

</script>


</body>

</html>
