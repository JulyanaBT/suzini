<!doctype html>
<html lang="fr">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#18b8ff"
  >

  <title>
    Équipes | BT250 Suzini — Double Mixte
  </title>


  <!-- CSS commun -->

  <link
    rel="stylesheet"
    href="assets/css/style.css"
  >


  <style>

    /* ========================================
       PAGE ÉQUIPES
    ======================================== */

    main{
      padding-top:0;
      padding-bottom:24px;
    }

    .section{
      margin-top:10px;
    }

    .section:first-child{
      margin-top:0;
    }

    .compact-panel{
      padding:12px;
      border-radius:22px;
    }


    /* ========================================
       TITRE
    ======================================== */

    .top-box{
      padding:12px;

      border-radius:0 0 22px 22px;

      background:var(--pink);
      color:#fff;

      box-shadow:
        var(--shadow-soft);
    }

    .top-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }

    .top-title{
      margin:0;

      font-size:24px;
      font-weight:1000;
      line-height:1;

      letter-spacing:-.04em;
    }

    .top-pill{
      flex-shrink:0;

      padding:7px 11px;

      border-radius:999px;

      background:#fff;
      color:var(--blue-dark);

      font-size:12px;
      font-weight:1000;
    }


    /* ========================================
       RÉSUMÉ
    ======================================== */

    .summary-grid{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:8px;
    }

    .summary-box{
      padding:10px;

      border-radius:16px;

      background:#fff;
      color:var(--blue-dark);

      text-align:center;
      font-weight:1000;

      box-shadow:
        0 6px 14px rgba(16,24,40,.08);
    }

    .summary-box strong{
      display:block;

      font-size:24px;
      line-height:1;
    }

    .summary-box span{
      display:block;

      margin-top:4px;

      color:var(--muted);

      font-size:10px;
      text-transform:uppercase;
      letter-spacing:.04em;
    }


    /* ========================================
       LISTE DES ÉQUIPES
    ======================================== */

    .teams-list{
      display:grid;
      gap:8px;
    }

    .team-card{
      display:grid;
      grid-template-columns:1fr 58px;
      gap:10px;
      align-items:center;

      padding:11px;

      border:
        1px solid rgba(16,24,40,.08);

      border-radius:18px;

      background:#fff;
      color:var(--text);

      box-shadow:
        0 8px 18px rgba(16,24,40,.10);
    }

    .team-left{
      min-width:0;

      display:grid;
      gap:6px;
    }

    .team-name{
      overflow:hidden;

      color:var(--blue-dark);

      font-size:18px;
      font-weight:1000;
      line-height:1.05;

      white-space:nowrap;
      text-overflow:ellipsis;
    }

    .team-num{
      color:var(--muted);

      font-size:11px;
      font-weight:1000;
    }


    /* ========================================
       JOUEURS
    ======================================== */

    .player-line{
      min-width:0;
      min-height:28px;

      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;

      padding:6px 8px;

      border-radius:13px;

      background:#f8fafc;

      font-size:13px;
      font-weight:950;
      line-height:1.1;
    }

    .player-name{
      min-width:0;

      overflow:hidden;

      white-space:nowrap;
      text-overflow:ellipsis;
    }

    .rank-pill{
      flex-shrink:0;

      padding:4px 8px;

      border-radius:999px;

      background:#fff7d6;
      color:var(--text);

      font-size:11px;
      font-weight:1000;
    }


    /* ========================================
       POIDS DE L'ÉQUIPE
    ======================================== */

    .rank-team{
      min-width:58px;
      min-height:58px;

      display:flex;
      align-items:center;
      justify-content:center;

      border-radius:18px;

      background:
        linear-gradient(
          180deg,
          var(--yellow),
          #f3b800
        );

      color:var(--text);

      text-align:center;
      font-size:20px;
      font-weight:1000;

      box-shadow:
        0 8px 16px rgba(255,216,77,.22);
    }


    /* ========================================
       INFORMATIONS
    ======================================== */

    .empty{
      padding:12px;

      border-radius:16px;

      background:#fff;
      color:var(--muted);

      font-size:14px;
      font-weight:900;
      text-align:center;
    }

    .note{
      margin-top:10px;

      color:var(--muted);

      font-size:12px;
      font-weight:850;
      line-height:1.3;
    }


    /* ========================================
       DESKTOP
    ======================================== */

    @media(min-width:760px){

      .teams-list{
        grid-template-columns:1fr 1fr;
      }

      .top-box{
        padding:16px;
      }

    }

  </style>

</head>


<body
  data-page="participants"
  data-title="BT250 Suzini — Double Mixte"
  data-date="02 octobre 2026"
>


<div id="siteHeader"></div>


<main class="container">


  <!-- ======================================
       TITRE
  ======================================= -->

  <section class="section">

    <div class="top-box">

      <div class="top-row">

        <h1 class="top-title">
          👥 Équipes
        </h1>

        <div class="top-pill">
          12 max
        </div>

      </div>

    </div>

  </section>


  <!-- ======================================
       RÉSUMÉ
  ======================================= -->

  <section class="section">

    <div class="panel compact-panel">

      <div class="summary-grid">


        <div class="summary-box">

          <strong id="countTotal">
            0
          </strong>

          <span>
            Équipes
          </span>

        </div>


        <div class="summary-box">

          <strong id="countRegistered">
            0
          </strong>

          <span>
            Inscrites
          </span>

        </div>


        <div class="summary-box">

          <strong id="countConfirmed">
            0
          </strong>

          <span>
            Confirmées
          </span>

        </div>


      </div>

    </div>

  </section>


  <!-- ======================================
       ÉQUIPES
  ======================================= -->

  <section class="section">

    <div class="panel compact-panel">

      <div
        id="teamsList"
        class="teams-list"
      >

        <div class="empty">
          Chargement des équipes…
        </div>

      </div>


      <p class="note">
        Les classements affichés sont indicatifs
        et pourront être ajustés par l’organisation.
      </p>

    </div>

  </section>


</main>


<!-- ======================================
     HEADER
======================================= -->

<script
  type="module"
  src="assets/js/header-tournament.js"
></script>


<!-- ======================================
     FIRESTORE
======================================= -->

<script type="module">

  import {
    db
  } from "./assets/js/firebase.js";


  import {
    collection,
    onSnapshot,
    query,
    orderBy
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";


  /* ========================================
     CONFIGURATION
  ======================================== */

  const EVENT_ID =
    "suzini-bt250-mixte-2026-10-02";


  const MAX_TEAMS =
    12;


  /* ========================================
     ÉLÉMENTS
  ======================================== */

  const teamsList =
    document.getElementById(
      "teamsList"
    );


  const countTotal =
    document.getElementById(
      "countTotal"
    );


  const countRegistered =
    document.getElementById(
      "countRegistered"
    );


  const countConfirmed =
    document.getElementById(
      "countConfirmed"
    );


  /* ========================================
     FIRESTORE
  ======================================== */

  const teamsRef =
    collection(
      db,
      "events",
      EVENT_ID,
      "teams"
    );


  /* ========================================
     OUTILS
  ======================================== */

  function esc(value){

    return String(value || "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  function toNum(value){

    if(
      value === null ||
      value === undefined ||
      value === ""
    ){

      return null;

    }


    const number =
      Number(
        String(value)
          .replace(",", ".")
          .trim()
      );


    return Number.isFinite(number)
      ? number
      : null;

  }


  function fmtRank(value){

    const number =
      toNum(value);


    return number === null
      ? "—"
      : String(number);

  }


  function playerShort(player){

    const prenom =
      String(
        player?.prenom || ""
      ).trim() || "Joueur";


    const nom =
      String(
        player?.nom || ""
      ).trim();


    const initial =
      nom
        ? ` ${nom.charAt(0).toUpperCase()}.`
        : "";


    return `${prenom}${initial}`;

  }


  function playerRank(
    player,
    fallback
  ){

    return (
      player?.rank ??
      fallback ??
      null
    );

  }


  /* ========================================
     POIDS DE L'ÉQUIPE
  ======================================== */

  function teamRank(team){

    const woman =
      team.woman ||
      team.player1 ||
      {};


    const man =
      team.man ||
      team.player2 ||
      {};


    const womanRank =
      toNum(
        playerRank(
          woman,
          team.p1Rank
        )
      );


    const manRank =
      toNum(
        playerRank(
          man,
          team.p2Rank
        )
      );


    if(
      womanRank === null ||
      manRank === null
    ){

      return null;

    }


    return (
      womanRank +
      manRank
    );

  }


  /* ========================================
     ÉQUIPES À AFFICHER
  ======================================== */

  function isVisibleTeam(team){

    return (
      team.status !== "deleted" &&
      team.status !== "cancelled" &&
      team.status !== "refused" &&
      team.stby !== true &&
      team.list !== "wait"
    );

  }


  /* ========================================
     CARTE ÉQUIPE
  ======================================== */

  function teamCard(
    team,
    index
  ){

    const woman =
      team.woman ||
      team.player1 ||
      {};


    const man =
      team.man ||
      team.player2 ||
      {};


    const teamName =
      team.teamName ||
      `${woman.prenom || "Joueuse"} & ${man.prenom || "Joueur"}`;


    const womanRank =
      playerRank(
        woman,
        team.p1Rank
      );


    const manRank =
      playerRank(
        man,
        team.p2Rank
      );


    const rank =
      teamRank(team);


    return `

      <div class="team-card">


        <div class="team-left">


          <div>

            <div class="team-num">
              #${index + 1}
            </div>

            <div class="team-name">
              ${esc(teamName)}
            </div>

          </div>


          <div class="player-line">

            <span class="player-name">
              👩 ${esc(
                playerShort(woman)
              )}
            </span>

            <span class="rank-pill">
              ${esc(
                fmtRank(womanRank)
              )}
            </span>

          </div>


          <div class="player-line">

            <span class="player-name">
              👨 ${esc(
                playerShort(man)
              )}
            </span>

            <span class="rank-pill">
              ${esc(
                fmtRank(manRank)
              )}
            </span>

          </div>


        </div>


        <div
          class="rank-team"
          title="Somme des classements"
        >
          ${esc(
            fmtRank(rank)
          )}
        </div>


      </div>

    `;

  }


  /* ========================================
     ÉCOUTE DES ÉQUIPES
  ======================================== */

  onSnapshot(

    query(
      teamsRef,
      orderBy(
        "createdAt",
        "asc"
      )
    ),

    snapshot => {


      const teams =
        snapshot.docs

          .map(
            documentSnapshot => ({

              id:
                documentSnapshot.id,

              ...documentSnapshot.data()

            })
          )

          .filter(
            isVisibleTeam
          )

          .sort(
            (a, b) => {

              /*
               * Classement d'équipe :
               * plus la somme est faible,
               * mieux l'équipe est classée.
               */

              const aRank =
                teamRank(a);


              const bRank =
                teamRank(b);


              const aValue =
                aRank === null
                  ? Number.POSITIVE_INFINITY
                  : aRank;


              const bValue =
                bRank === null
                  ? Number.POSITIVE_INFINITY
                  : bRank;


              if(aValue !== bValue){

                return (
                  aValue -
                  bValue
                );

              }


              /*
               * À classement égal ou inconnu :
               * ordre d'inscription.
               */

              const aTime =
                a.createdAt?.seconds ||
                0;


              const bTime =
                b.createdAt?.seconds ||
                0;


              return (
                aTime -
                bTime
              );

            }
          );


      /* ====================================
         COMPTEURS
      ==================================== */

      let registered =
        0;


      let confirmed =
        0;


      teams.forEach(
        team => {

          if(
            team.status ===
            "confirmed"
          ){

            confirmed++;

          }

          else{

            registered++;

          }

        }
      );


      countTotal.textContent =
        String(
          teams.length
        );


      countRegistered.textContent =
        String(
          registered
        );


      countConfirmed.textContent =
        String(
          confirmed
        );


      /* ====================================
         AFFICHAGE
      ==================================== */

      teamsList.innerHTML =
        teams.length

          ? teams
              .map(
                teamCard
              )
              .join("")

          : `
              <div class="empty">
                Aucune équipe inscrite pour le moment.
              </div>
            `;

    },


    error => {

      console.error(error);


      teamsList.innerHTML = `

        <div class="empty">
          Impossible de charger les équipes.
        </div>

      `;

    }

  );

</script>


</body>

</html>
