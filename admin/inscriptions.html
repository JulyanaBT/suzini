<!doctype html>

<html lang="fr">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#101010"
  >

  <title>
    Inscriptions | Administration BT250
  </title>


  <link
    rel="stylesheet"
    href="../assets/css/style.css"
  >


  <style>

    /* ========================================
       PAGE
    ======================================== */

    body{
      background:var(--sand-light);
    }


    .registrations-page{
      padding-top:8px;
      padding-bottom:26px;
    }


    /* ========================================
       SOUS-MENU PRINCIPAL
    ======================================== */

    .admin-subnav{

      display:grid;

      grid-template-columns:
        repeat(2,minmax(0,1fr));

      gap:5px;

      padding:6px;

      border-radius:15px;

      background:#fff;

      box-shadow:
        0 6px 18px
        rgba(0,0,0,.06);
    }


    .admin-subnav button{

      min-width:0;
      min-height:42px;

      padding:8px 6px;

      border:0;
      border-radius:11px;

      background:#eeeeee;
      color:#444;

      font:inherit;
      font-size:11px;
      font-weight:950;

      cursor:pointer;

      -webkit-tap-highlight-color:
        transparent;
    }


    .admin-subnav button.active{

      background:#111;
      color:#fff;
    }


    /* ========================================
       VUES
    ======================================== */

    .admin-view{
      display:block;
    }


    .admin-view.hidden{
      display:none;
    }


    /* ========================================
       ÉTAT INSCRIPTIONS
    ======================================== */

    .registration-control{

      margin-top:8px;

      padding:12px;

      border-radius:16px;

      background:white;

      box-shadow:
        0 6px 18px
        rgba(0,0,0,.06);
    }


    .registration-state-line{

      display:flex;

      align-items:center;
      justify-content:space-between;

      gap:10px;
    }


    .registration-state-label{

      color:#777;

      font-size:9px;
      font-weight:950;

      letter-spacing:.5px;

      text-transform:uppercase;
    }


    .registration-state{

      padding:5px 9px;

      border-radius:999px;

      background:#eee;
      color:#555;

      font-size:9px;
      font-weight:950;

      white-space:nowrap;
    }


    .registration-state[data-state="open"]{
      background:#ddf7e7;
      color:#126a35;
    }


    .registration-state[data-state="paused"]{
      background:#fff3cd;
      color:#8a6500;
    }


    .registration-state[data-state="closed"]{
      background:#ffe3de;
      color:#a52d18;
    }


    .registration-state[data-state="not_open"]{
      background:#eee;
      color:#666;
    }


    /* ========================================
       BOUTONS STATUT
    ======================================== */

    .registration-actions{

      display:grid;

      grid-template-columns:
        repeat(2,minmax(0,1fr));

      gap:6px;

      margin-top:10px;
    }


    .state-action{

      min-width:0;
      min-height:42px;

      padding:7px 5px;

      border:2px solid transparent;
      border-radius:11px;

      background:#f1f1f1;
      color:#555;

      font:inherit;
      font-size:10px;
      font-weight:950;

      cursor:pointer;

      -webkit-tap-highlight-color:
        transparent;
    }


    .state-action:active{
      transform:scale(.98);
    }


    .state-action[data-state="not_open"]{
      background:#f1f1f1;
      color:#666;
    }


    .state-action[data-state="open"]{
      background:#e5f8ec;
      color:#126a35;
    }


    .state-action[data-state="paused"]{
      background:#fff5d7;
      color:#8a6500;
    }


    .state-action[data-state="closed"]{
      background:#fff0ec;
      color:#c83417;
    }


    .state-action.current{
      border-color:currentColor;
    }


    .state-action:disabled{
      opacity:.45;
      cursor:not-allowed;
    }


    .status-message{

      display:none;

      margin-top:8px;

      padding:8px 10px;

      border-radius:10px;

      background:#f3f3f3;
      color:#666;

      font-size:9px;
      font-weight:850;

      text-align:center;
    }


    .status-message.visible{
      display:block;
    }


    .status-message.ok{
      background:#ddf7e7;
      color:#126a35;
    }


    .status-message.error{
      background:#fff0ec;
      color:#c83417;
    }


    /* ========================================
       COMPTEURS INSCRIPTIONS
    ======================================== */

    .registration-summary{

      display:grid;

      grid-template-columns:
        repeat(3,minmax(0,1fr));

      gap:6px;

      margin-top:8px;
    }


    .summary-card{

      padding:10px 5px;

      border-radius:14px;

      background:white;

      text-align:center;

      box-shadow:
        0 6px 18px
        rgba(0,0,0,.06);
    }


    .summary-card strong{

      display:block;

      color:#111;

      font-size:21px;
      line-height:1;

      font-weight:1000;
    }


    .summary-card span{

      display:block;

      margin-top:4px;

      color:#777;

      font-size:8px;
      font-weight:900;

      letter-spacing:.35px;

      text-transform:uppercase;
    }


    /* ========================================
       ONGLETS INSCRITS
    ======================================== */

    .registration-tabs{

      display:grid;

      grid-template-columns:
        repeat(3,minmax(0,1fr));

      gap:5px;

      margin-top:8px;

      padding:5px;

      border-radius:14px;

      background:white;

      box-shadow:
        0 6px 18px
        rgba(0,0,0,.05);
    }


    .registration-tab{

      min-width:0;
      min-height:39px;

      padding:5px 3px;

      border:0;
      border-radius:10px;

      background:#f1f1f1;
      color:#666;

      font:inherit;
      font-size:9px;
      font-weight:950;

      cursor:pointer;
    }


    .registration-tab.active{
      background:#111;
      color:white;
    }


    /* ========================================
       TITRE DE LISTE
    ======================================== */

    .list-head{

      display:flex;

      align-items:flex-end;
      justify-content:space-between;

      gap:10px;

      margin-top:13px;
      margin-bottom:7px;

      padding:0 2px;
    }


    .list-kicker{

      color:var(--orange);

      font-size:8px;
      font-weight:950;

      letter-spacing:.8px;

      text-transform:uppercase;
    }


    .list-head h2{

      margin:3px 0 0;

      color:#111;

      font-size:19px;
      line-height:1;

      font-weight:1000;
    }


    .list-head p{

      margin:4px 0 0;

      color:#777;

      font-size:9px;
      line-height:1.3;

      font-weight:700;
    }


    .live-pill{

      flex:0 0 auto;

      padding:4px 7px;

      border-radius:999px;

      background:#ddf7e7;
      color:#126a35;

      font-size:8px;
      font-weight:950;

      text-transform:uppercase;
    }


    /* ========================================
       LISTE INSCRITS
    ======================================== */

    .items-list{

      display:grid;
      gap:7px;
    }


    .item-card{

      padding:11px;

      border-radius:15px;

      background:white;

      box-shadow:
        0 6px 18px
        rgba(0,0,0,.06);
    }


    .item-head{

      display:flex;

      align-items:flex-start;
      justify-content:space-between;

      gap:8px;

      margin-bottom:8px;
    }


    .item-title{

      min-width:0;

      color:#111;

      font-size:15px;
      line-height:1.1;

      font-weight:1000;
    }


    .item-state{

      flex:0 0 auto;

      padding:4px 7px;

      border-radius:999px;

      background:#eee;
      color:#666;

      font-size:8px;
      font-weight:950;

      text-transform:uppercase;
    }


    .item-state.confirmed,
    .item-state.active,
    .item-state.accepted{

      background:#ddf7e7;
      color:#126a35;
    }


    .item-state.pending,
    .item-state.registered{

      background:#fff3cd;
      color:#8a6500;
    }


    .item-state.closed,
    .item-state.refused{

      background:#ffe3de;
      color:#a52d18;
    }


    .item-meta{

      color:#666;

      font-size:10px;
      font-weight:750;

      line-height:1.5;
    }


    .item-meta strong{

      color:#222;
      font-weight:950;
    }


    .item-description{

      margin-top:7px;

      padding:8px 9px;

      border-radius:10px;

      background:#f5f5f5;
      color:#555;

      font-size:10px;
      line-height:1.4;

      font-weight:700;
    }


    /* ========================================
       ACTIONS CARTES
    ======================================== */

    .item-actions{

      display:grid;

      grid-template-columns:
        repeat(2,minmax(0,1fr));

      gap:5px;

      margin-top:9px;
    }


    .item-action{

      min-width:0;
      min-height:36px;

      padding:5px;

      border:0;
      border-radius:9px;

      background:#f1f1f1;
      color:#555;

      font:inherit;
      font-size:9px;
      font-weight:950;

      cursor:pointer;
    }


    .item-action.green{
      background:#ddf7e7;
      color:#126a35;
    }


    .item-action.yellow{
      background:#fff3cd;
      color:#8a6500;
    }


    .item-action.orange{
      background:#fff0ec;
      color:#c83417;
    }


    .item-action:disabled{
      opacity:.45;
    }


    /* ========================================
       PAIEMENTS — COMPTEURS
    ======================================== */

    .payment-summary{

      display:grid;

      grid-template-columns:
        repeat(3,minmax(0,1fr));

      gap:6px;

      margin-top:8px;
    }


    .payment-summary-card{

      padding:10px 6px;

      border-radius:14px;

      background:#fff;

      text-align:center;

      box-shadow:
        0 6px 18px
        rgba(0,0,0,.06);
    }


    .payment-summary-card strong{

      display:block;

      color:#111;

      font-size:21px;
      line-height:1;

      font-weight:1000;
    }


    .payment-summary-card span{

      display:block;

      margin-top:4px;

      color:#777;

      font-size:8px;
      font-weight:900;

      letter-spacing:.4px;

      text-transform:uppercase;
    }


    /* ========================================
       PAIEMENTS — LISTE
    ======================================== */

    .payment-list{

      display:grid;

      gap:7px;

      margin-top:8px;
    }


    .payment-row{

      padding:10px;

      border-radius:15px;

      background:#fff;

      box-shadow:
        0 6px 18px
        rgba(0,0,0,.06);
    }


    .payment-player{

      display:flex;

      align-items:flex-start;
      justify-content:space-between;

      gap:8px;

      margin-bottom:8px;
    }


    .payment-player-info{
      min-width:0;
    }


    .payment-name{

      overflow:hidden;

      color:#111;

      font-size:15px;
      font-weight:1000;

      line-height:1.15;

      text-overflow:ellipsis;
      white-space:nowrap;
    }


    .payment-team{

      margin-top:3px;

      color:#888;

      font-size:8px;
      font-weight:800;

      line-height:1.25;
    }


    .payment-state{

      flex:0 0 auto;

      padding:4px 7px;

      border-radius:999px;

      background:#fff0ec;
      color:#c83417;

      font-size:8px;
      font-weight:950;

      text-transform:uppercase;
    }


    .payment-row[data-payment="cash"]
    .payment-state{

      background:#ddf7e7;
      color:#126a35;
    }


    .payment-row[data-payment="cb"]
    .payment-state{

      background:#e4f7fc;
      color:#147d99;
    }


    /* ========================================
       PAIEMENTS — BOUTONS
    ======================================== */

    .payment-actions{

      display:grid;

      grid-template-columns:
        repeat(3,minmax(0,1fr));

      gap:5px;
    }


    .payment-action{

      min-width:0;
      min-height:39px;

      padding:6px 4px;

      border:2px solid transparent;
      border-radius:10px;

      background:#f1f1f1;
      color:#555;

      font:inherit;
      font-size:10px;
      font-weight:950;

      cursor:pointer;

      white-space:nowrap;

      -webkit-tap-highlight-color:
        transparent;
    }


    .payment-action:active{
      transform:scale(.98);
    }


    .payment-action.active-unpaid{

      border-color:var(--orange);

      background:#fff0ec;
      color:#c83417;
    }


    .payment-action.active-cash{

      border-color:#26a65b;

      background:#ddf7e7;
      color:#126a35;
    }


    .payment-action.active-cb{

      border-color:#2fa7c7;

      background:#e4f7fc;
      color:#147d99;
    }


    .payment-action:disabled{
      opacity:.45;
    }


    /* ========================================
       VIDE / CHARGEMENT
    ======================================== */

    .list-empty,
    .payment-empty{

      padding:25px 15px;

      border-radius:16px;

      background:white;
      color:#777;

      font-size:11px;
      font-weight:800;

      text-align:center;

      box-shadow:
        0 6px 18px
        rgba(0,0,0,.05);
    }


    .payment-empty{
      margin-top:8px;
    }


    /* ========================================
       RESPONSIVE
    ======================================== */

    @media(min-width:560px){

      .registration-actions{

        grid-template-columns:
          repeat(4,minmax(0,1fr));
      }


      .items-list{

        grid-template-columns:
          repeat(2,minmax(0,1fr));
      }


      .payment-list{

        grid-template-columns:
          repeat(2,minmax(0,1fr));
      }

    }

  </style>

</head>


<body
  data-page="inscriptions"
  data-admin="true"
>


<div id="siteHeader"></div>


<main class="container registrations-page">


  <!-- ======================================
       SOUS-MENU
  ======================================= -->

  <nav
    class="admin-subnav"
    aria-label="Gestion des inscriptions"
  >

    <button
      id="viewRegistrations"
      class="active"
      type="button"
      aria-selected="true"
    >
      👥 Inscrits
    </button>


    <button
      id="viewPayments"
      type="button"
      aria-selected="false"
    >
      💳 Paiements
    </button>

  </nav>



  <!-- ======================================
       VUE INSCRITS
  ======================================= -->

  <div
    id="registrationsView"
    class="admin-view"
  >


    <!-- ÉTAT INSCRIPTIONS -->

    <section class="registration-control">


      <div class="registration-state-line">

        <span class="registration-state-label">
          État des inscriptions
        </span>


        <span
          id="currentState"
          class="registration-state"
          data-state="loading"
        >
          Chargement…
        </span>

      </div>


      <div class="registration-actions">


        <button
          id="btnNotOpen"
          class="state-action"
          data-state="not_open"
          type="button"
        >
          💤 Pas ouvertes
        </button>


        <button
          id="btnOpen"
          class="state-action"
          data-state="open"
          type="button"
        >
          ✅ Ouvrir
        </button>


        <button
          id="btnPause"
          class="state-action"
          data-state="paused"
          type="button"
        >
          ⏸️ Suspendre
        </button>


        <button
          id="btnClose"
          class="state-action"
          data-state="closed"
          type="button"
        >
          🔒 Clôturer
        </button>


      </div>


      <div
        id="statusMessage"
        class="status-message"
      ></div>


    </section>



    <!-- COMPTEURS -->

    <section class="registration-summary">


      <div class="summary-card">

        <strong id="countTotal">
          0
        </strong>

        <span>
          Équipes
        </span>

      </div>


      <div class="summary-card">

        <strong id="countConfirmed">
          0
        </strong>

        <span>
          Confirmées
        </span>

      </div>


      <div class="summary-card">

        <strong id="countRemaining">
          12
        </strong>

        <span>
          Places
        </span>

      </div>


    </section>



    <!-- ONGLETS -->

    <section class="registration-tabs">


      <button
        id="tabTeams"
        class="registration-tab active"
        type="button"
      >
        👥 Équipes
      </button>


      <button
        id="tabProfiles"
        class="registration-tab"
        type="button"
      >
        🔎 Recherches
      </button>


      <button
        id="tabInvites"
        class="registration-tab"
        type="button"
      >
        🤝 Propositions
      </button>


    </section>



    <!-- TITRE LISTE -->

    <section class="list-head">


      <div>

        <div class="list-kicker">
          Suivi en direct
        </div>


        <h2 id="listTitle">
          Équipes inscrites
        </h2>


        <p id="listText">
          Liste des équipes du tournoi.
        </p>

      </div>


      <span class="live-pill">
        Live
      </span>


    </section>



    <!-- LISTE -->

    <section
      id="itemsList"
      class="items-list"
    >

      <div class="list-empty">
        Chargement…
      </div>

    </section>


  </div>



  <!-- ======================================
       VUE PAIEMENTS
  ======================================= -->

  <div
    id="paymentsView"
    class="admin-view hidden"
  >


    <!-- COMPTEURS -->

    <section class="payment-summary">


      <div class="payment-summary-card">

        <strong id="unpaidCount">
          0
        </strong>

        <span>
          Non payés
        </span>

      </div>


      <div class="payment-summary-card">

        <strong id="cashCount">
          0
        </strong>

        <span>
          Espèces
        </span>

      </div>


      <div class="payment-summary-card">

        <strong id="cbCount">
          0
        </strong>

        <span>
          CB
        </span>

      </div>


    </section>


    <!-- TITRE -->

    <section class="list-head">

      <div>

        <div class="list-kicker">
          Suivi des règlements
        </div>

        <h2>
          Paiements
        </h2>

        <p>
          Paiement individuel de chaque joueur.
        </p>

      </div>

      <span class="live-pill">
        Live
      </span>

    </section>


    <!-- LISTE -->

    <section
      id="paymentList"
      class="payment-list"
    ></section>


    <div
      id="paymentEmpty"
      class="payment-empty"
      hidden
    >
      Aucun joueur inscrit.
    </div>


  </div>


</main>



<script
  type="module"
  src="../assets/js/admin-header.js"
></script>



<script type="module">

  /* ========================================
     SESSION
  ======================================== */

  import {
    requireAdmin
  } from "../assets/js/admin-session.js";


  if(!requireAdmin()){

    throw new Error(
      "Accès administrateur requis."
    );

  }


  /* ========================================
     FIREBASE
  ======================================== */

  import {
    db
  } from "../assets/js/firebase.js";


  import {
    collection,
    doc,
    onSnapshot,
    setDoc,
    updateDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";


  /* ========================================
     CONFIGURATION
  ======================================== */

  const EVENT_ID =
    "suzini-bt250-mixte-2026-10-02";


  const MAX_TEAMS =
    12;


  /* ========================================
     RÉFÉRENCES
  ======================================== */

  const statusRef =
    doc(
      db,
      "events",
      EVENT_ID,
      "config",
      "status"
    );


  const teamsRef =
    collection(
      db,
      "events",
      EVENT_ID,
      "teams"
    );


  const profilesRef =
    collection(
      db,
      "events",
      EVENT_ID,
      "partnerProfiles"
    );


  const invitesRef =
    collection(
      db,
      "events",
      EVENT_ID,
      "teamInvitations"
    );


  /* ========================================
     ÉLÉMENTS — SOUS MENU
  ======================================== */

  const viewRegistrations =
    document.getElementById(
      "viewRegistrations"
    );


  const viewPayments =
    document.getElementById(
      "viewPayments"
    );


  const registrationsView =
    document.getElementById(
      "registrationsView"
    );


  const paymentsView =
    document.getElementById(
      "paymentsView"
    );


  /* ========================================
     ÉLÉMENTS — INSCRIPTIONS
  ======================================== */

  const currentState =
    document.getElementById(
      "currentState"
    );


  const statusMessage =
    document.getElementById(
      "statusMessage"
    );


  const btnNotOpen =
    document.getElementById(
      "btnNotOpen"
    );


  const btnOpen =
    document.getElementById(
      "btnOpen"
    );


  const btnPause =
    document.getElementById(
      "btnPause"
    );


  const btnClose =
    document.getElementById(
      "btnClose"
    );


  const stateButtons = [
    btnNotOpen,
    btnOpen,
    btnPause,
    btnClose
  ];


  const countTotal =
    document.getElementById(
      "countTotal"
    );


  const countConfirmed =
    document.getElementById(
      "countConfirmed"
    );


  const countRemaining =
    document.getElementById(
      "countRemaining"
    );


  const tabTeams =
    document.getElementById(
      "tabTeams"
    );


  const tabProfiles =
    document.getElementById(
      "tabProfiles"
    );


  const tabInvites =
    document.getElementById(
      "tabInvites"
    );


  const listTitle =
    document.getElementById(
      "listTitle"
    );


  const listText =
    document.getElementById(
      "listText"
    );


  const itemsList =
    document.getElementById(
      "itemsList"
    );


  /* ========================================
     ÉLÉMENTS — PAIEMENTS
  ======================================== */

  const unpaidCount =
    document.getElementById(
      "unpaidCount"
    );


  const cashCount =
    document.getElementById(
      "cashCount"
    );


  const cbCount =
    document.getElementById(
      "cbCount"
    );


  const paymentList =
    document.getElementById(
      "paymentList"
    );


  const paymentEmpty =
    document.getElementById(
      "paymentEmpty"
    );


  /* ========================================
     ÉTAT LOCAL
  ======================================== */

  let currentStatus =
    "not_open";


  let currentTab =
    "teams";


  let unsubscribeMain =
    null;


  let teamsCache =
    [];


  /* ========================================
     OUTILS
  ======================================== */

  function esc(value){

    return String(
      value ?? ""
    )
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");

  }


  function timestampValue(row){

    const createdAt =
      row?.createdAt;


    if(
      createdAt &&
      typeof createdAt.toMillis === "function"
    ){

      return createdAt.toMillis();

    }


    return 0;

  }


  function sortByCreatedAt(rows){

    return [...rows].sort(
      (a,b) =>
        timestampValue(a) -
        timestampValue(b)
    );

  }


  function stateLabel(state){

    switch(state){

      case "open":
        return "Ouvertes";

      case "paused":
        return "Suspendues";

      case "closed":
        return "Clôturées";

      default:
        return "Pas ouvertes";

    }

  }


  function showStatusMessage(
    message,
    type = ""
  ){

    statusMessage.textContent =
      message;


    statusMessage.className =
      "status-message visible";


    if(type){

      statusMessage.classList.add(
        type
      );

    }

  }


  /* ========================================
     SOUS-MENU PRINCIPAL
  ======================================== */

  function showMainView(view){

    const registrationsActive =
      view === "registrations";


    viewRegistrations.classList.toggle(
      "active",
      registrationsActive
    );


    viewPayments.classList.toggle(
      "active",
      !registrationsActive
    );


    viewRegistrations.setAttribute(
      "aria-selected",
      String(registrationsActive)
    );


    viewPayments.setAttribute(
      "aria-selected",
      String(!registrationsActive)
    );


    registrationsView.classList.toggle(
      "hidden",
      !registrationsActive
    );


    paymentsView.classList.toggle(
      "hidden",
      registrationsActive
    );

  }


  viewRegistrations.addEventListener(
    "click",
    () => {

      showMainView(
        "registrations"
      );

    }
  );


  viewPayments.addEventListener(
    "click",
    () => {

      showMainView(
        "payments"
      );

    }
  );


  /* ========================================
     STATUT DES INSCRIPTIONS
  ======================================== */

  function setButtonsDisabled(
    disabled
  ){

    stateButtons.forEach(
      button => {

        button.disabled =
          disabled;

      }
    );

  }


  function updateStateDisplay(){

    currentState.textContent =
      stateLabel(
        currentStatus
      );


    currentState.dataset.state =
      currentStatus;


    stateButtons.forEach(
      button => {

        button.classList.toggle(
          "current",
          button.dataset.state ===
            currentStatus
        );

      }
    );

  }


  async function setState(
    nextState
  ){

    setButtonsDisabled(
      true
    );


    showStatusMessage(
      "Mise à jour…"
    );


    try{

      await setDoc(

        statusRef,

        {
          inscriptionsState:
            nextState,

          updatedAt:
            serverTimestamp()
        },

        {
          merge:true
        }

      );


      showStatusMessage(
        "✓ Statut mis à jour.",
        "ok"
      );

    }

    catch(error){

      console.error(
        error
      );


      showStatusMessage(
        "Impossible de modifier le statut.",
        "error"
      );

    }

    finally{

      setButtonsDisabled(
        false
      );

    }

  }


  onSnapshot(

    statusRef,

    snapshot => {

      const data =
        snapshot.exists()
          ? snapshot.data()
          : {};


      currentStatus =
        data.inscriptionsState ||
        "not_open";


      updateStateDisplay();

    },

    error => {

      console.error(
        error
      );


      currentState.textContent =
        "Erreur";


      currentState.dataset.state =
        "closed";

    }

  );


  btnNotOpen.addEventListener(
    "click",
    () => setState("not_open")
  );


  btnOpen.addEventListener(
    "click",
    () => setState("open")
  );


  btnPause.addEventListener(
    "click",
    () => setState("paused")
  );


  btnClose.addEventListener(
    "click",
    () => setState("closed")
  );


  /* ========================================
     ÉQUIPES VISIBLES
  ======================================== */

  function getVisibleTeams(rows){

    return rows.filter(
      row =>
        row.status !== "deleted" &&
        row.status !== "cancelled" &&
        row.status !== "refused" &&
        row.stby !== true &&
        row.list !== "wait"
    );

  }


  /* ========================================
     COMPTEURS INSCRIPTIONS
  ======================================== */

  function updateTeamCounters(rows){

    const visible =
      getVisibleTeams(
        rows
      );


    const confirmed =
      visible.filter(
        row =>
          row.status ===
          "confirmed"
      ).length;


    countTotal.textContent =
      String(
        visible.length
      );


    countConfirmed.textContent =
      String(
        confirmed
      );


    countRemaining.textContent =
      String(
        Math.max(
          0,
          MAX_TEAMS -
          visible.length
        )
      );

  }


  /* ========================================
     CARTE ÉQUIPE
  ======================================== */

  function teamCard(id,data){

    const woman =
      data.woman ||
      data.player1 ||
      {};


    const man =
      data.man ||
      data.player2 ||
      {};


    const status =
      data.status ||
      "registered";


    const teamName =
      data.teamName ||
      `${woman.prenom || "Joueuse"} & ${man.prenom || "Joueur"}`;


    const statusLabel =
      status === "confirmed"
        ? "Confirmée"
        : "Inscrite";


    return `

      <article class="item-card">

        <div class="item-head">

          <div class="item-title">
            ${esc(teamName)}
          </div>

          <span
            class="item-state ${esc(status)}"
          >
            ${esc(statusLabel)}
          </span>

        </div>


        <div class="item-meta">

          <strong>
            👩 Joueuse
          </strong>

          · ${esc(woman.prenom)}
          ${esc(woman.nom)}

          <br>

          Licence :
          ${esc(woman.licence || "—")}

          <br><br>

          <strong>
            👨 Joueur
          </strong>

          · ${esc(man.prenom)}
          ${esc(man.nom)}

          <br>

          Licence :
          ${esc(man.licence || "—")}

        </div>


        <div class="item-actions">

          <button
            class="item-action green"
            data-action="confirm"
            data-id="${esc(id)}"
            type="button"
          >
            ✓ Confirmer
          </button>


          <button
            class="item-action yellow"
            data-action="registered"
            data-id="${esc(id)}"
            type="button"
          >
            Inscrite
          </button>

        </div>

      </article>

    `;

  }


  /* ========================================
     CARTE RECHERCHE
  ======================================== */

      data.status ||
      "active";

      data.sexe === "F"

      <article class="item-card">

        <div class="item-head">

          <div class="item-title">
            ${esc(data.prenom || "Profil")}

          </div>

          <span
            class="item-state ${esc(status)}"
          >
            ${

            }
          </span>

        </div>


        <div class="item-meta">

          <strong>
            ${esc(sex)}
          </strong>

          <br>

          Licence :
          ${esc(data.licence || "—")}

          <br>

          Téléphone :
          ${esc(data.phone || "—")}

              <div class="item-description">

          <button

            data-action="profile-active"

          >
            ✓ Afficher
          </button>


          <button
            class="item-action orange"
            data-action="profile-closed"
            data-id="${esc(id)}"
            type="button"
          >
            Masquer
          </button>

        </div>

      </article>

    `;

  }


  /* ========================================
     CARTE PROPOSITION
  ======================================== */

  function inviteCard(id,data){

    const proposer =
      data.proposer ||
      {};


    const status =
      data.status ||
      "pending";


    const statusLabel =
      status === "accepted"
        ? "Acceptée"
        : status === "refused"
          ? "Refusée"
          : "En attente";

      <article class="item-card">

            )}
          </div>

            ${esc(statusLabel)}
          </span>

        </div>


        <div class="item-meta">

          <strong>

          </strong>

          <br>

          ${esc(proposer.prenom || "—")}
          ${esc(proposer.nom || "")}

          <br>

          Licence :
          ${esc(proposer.licence || "—")}

        </div>


        <div class="item-actions">

          <button
            class="item-action yellow"
            data-action="invite-pending"
            data-id="${esc(id)}"
            type="button"
          >
            En attente
          </button>


          <button
            class="item-action green"
            data-action="invite-accepted"
            data-id="${esc(id)}"
            type="button"
          >
            ✓ Acceptée
          </button>


          <button
            class="item-action orange"
            data-action="invite-refused"
            data-id="${esc(id)}"
            type="button"
          >
            Refusée
          </button>

        </div>

      </article>

    `;

  }


  /* ========================================
     ONGLETS INSCRITS
  ======================================== */

  function updateTabs(){

    tabTeams.classList.toggle(
      "active",
      currentTab === "teams"
    );


    tabProfiles.classList.toggle(
      "active",
      currentTab === "profiles"
    );


    tabInvites.classList.toggle(
      "active",
      currentTab === "invites"
    );


    if(currentTab === "profiles"){

      listTitle.textContent =
        "Recherches partenaire";


      listText.textContent =
        "Profils déposés par les joueurs en recherche.";

      return;

    }


    if(currentTab === "invites"){

      listTitle.textContent =
        "Propositions d'équipe";


      listText.textContent =
        "Propositions envoyées depuis les profils.";

      return;

    }


    listTitle.textContent =
      "Équipes inscrites";


    listText.textContent =
      "Suivi rapide des équipes du tournoi.";

  }


  function mainCollection(){

    if(currentTab === "profiles"){
      return profilesRef;
    }


    if(currentTab === "invites"){
      return invitesRef;
    }


    return teamsRef;

  }


  /* ========================================
     AFFICHAGE LISTE INSCRITS
  ======================================== */

  function renderRows(rows){

    const sortedRows =
      sortByCreatedAt(
        rows
      );


    if(currentTab === "profiles"){

      itemsList.innerHTML =
        sortedRows.length
          ? sortedRows
              .map(
                row =>
                  profileCard(
                    row.id,
                    row
                  )
              )
              .join("")
          : `
              <div class="list-empty">
                Aucun profil de recherche.
              </div>
            `;

      return;

    }


    if(currentTab === "invites"){

      itemsList.innerHTML =
        sortedRows.length
          ? sortedRows
              .map(
                row =>
                  inviteCard(
                    row.id,
                    row
                  )
              )
              .join("")
          : `
              <div class="list-empty">
                Aucune proposition.
              </div>
            `;

      return;

    }


    const visibleTeams =
      getVisibleTeams(
        sortedRows
      );


    itemsList.innerHTML =
      visibleTeams.length
        ? visibleTeams
            .map(
              row =>
                teamCard(
                  row.id,
                  row
                )
            )
            .join("")
        : `
            <div class="list-empty">
              Aucune équipe inscrite.
            </div>
          `;

  }


  function startMainListener(){

    if(unsubscribeMain){
      unsubscribeMain();
    }


    updateTabs();


    itemsList.innerHTML = `
      <div class="list-empty">
        Chargement…
      </div>
    `;


    unsubscribeMain =
      onSnapshot(

        mainCollection(),

        snapshot => {

          const rows =
            snapshot.docs.map(
              documentSnapshot => ({

                id:
                  documentSnapshot.id,

                ...documentSnapshot.data()

              })
            );


          renderRows(
            rows
          );

        },

        error => {

          console.error(
            error
          );


          itemsList.innerHTML = `
            <div class="list-empty">
              Erreur de chargement.
            </div>
          `;

        }

      );

  }


  /* ========================================
     PAIEMENTS
  ======================================== */

  function normalizePayment(value){

    if(
      value === "cash" ||
      value === "especes"
    ){
      return "cash";
    }


    if(value === "cb"){
      return "cb";
    }


    return "unpaid";

  }


  function paymentLabel(value){

    switch(value){

      case "cash":
        return "Espèces";

      case "cb":
        return "CB";

      default:
        return "Non payé";

    }

  }


  function getPaymentPlayers(rows){

    const visibleTeams =
      getVisibleTeams(
        sortByCreatedAt(rows)
      );


    const players =
      [];


    visibleTeams.forEach(
      team => {

        const woman =
          team.woman ||
          team.player1 ||
          {};


        const man =
          team.man ||
          team.player2 ||
          {};


        const teamName =
          team.teamName ||
          `${woman.prenom || "Joueuse"} & ${man.prenom || "Joueur"}`;


        players.push({

          teamId:
            team.id,

          role:
            "woman",

          name:
            `${woman.prenom || ""} ${woman.nom || ""}`.trim() ||
            "Joueuse",

          licence:
            woman.licence || "",

          teamName,

          payment:
            normalizePayment(
              woman.payment
            )

        });


        players.push({

          teamId:
            team.id,

          role:
            "man",

          name:
            `${man.prenom || ""} ${man.nom || ""}`.trim() ||
            "Joueur",

          licence:
            man.licence || "",

          teamName,

          payment:
            normalizePayment(
              man.payment
            )

        });

      }
    );


    return players;

  }


  function paymentRow(player){

    const payment =
      player.payment;


    return `

      <article
        class="payment-row"
        data-payment="${esc(payment)}"
      >

        <div class="payment-player">

          <div class="payment-player-info">

            <div class="payment-name">
              ${esc(player.name)}
            </div>

            <div class="payment-team">

              ${esc(player.teamName)}

              ${
                player.licence
                  ? ` · Licence ${esc(player.licence)}`
                  : ""
              }

            </div>

          </div>


          <span class="payment-state">
            ${esc(paymentLabel(payment))}
          </span>

        </div>


        <div class="payment-actions">


          <button
            class="
              payment-action
              ${
                payment === "unpaid"
                  ? "active-unpaid"
                  : ""
              }
            "
            data-payment-action="unpaid"
            data-team-id="${esc(player.teamId)}"
            data-role="${esc(player.role)}"
            type="button"
          >
            Non payé
          </button>


          <button
            class="
              payment-action
              ${
                payment === "cash"
                  ? "active-cash"
                  : ""
              }
            "
            data-payment-action="cash"
            data-team-id="${esc(player.teamId)}"
            data-role="${esc(player.role)}"
            type="button"
          >
            💶 Espèces
          </button>


          <button
            class="
              payment-action
              ${
                payment === "cb"
                  ? "active-cb"
                  : ""
              }
            "
            data-payment-action="cb"
            data-team-id="${esc(player.teamId)}"
            data-role="${esc(player.role)}"
            type="button"
          >
            💳 CB
          </button>


        </div>

      </article>

    `;

  }


  function renderPayments(rows){

    const players =
      getPaymentPlayers(
        rows
      );


    const unpaid =
      players.filter(
        player =>
          player.payment === "unpaid"
      ).length;


    const cash =
      players.filter(
        player =>
          player.payment === "cash"
      ).length;


    const cb =
      players.filter(
        player =>
          player.payment === "cb"
      ).length;


    unpaidCount.textContent =
      String(unpaid);


    cashCount.textContent =
      String(cash);


    cbCount.textContent =
      String(cb);


    if(!players.length){

      paymentList.innerHTML =
        "";


      paymentEmpty.hidden =
        false;


      return;

    }


    paymentEmpty.hidden =
      true;


    paymentList.innerHTML =
      players
        .map(
          player =>
            paymentRow(
              player
            )
        )
        .join("");

  }


  async function updatePlayerPayment(
    teamId,
    role,
    payment
  ){

    const team =
      teamsCache.find(
        row =>
          row.id === teamId
      );


    if(!team){

      throw new Error(
        "Équipe introuvable."
      );

    }


    const currentPlayer =
      role === "woman"
        ? (
            team.woman ||
            team.player1 ||
            {}
          )
        : (
            team.man ||
            team.player2 ||
            {}
          );


    const updatedPlayer = {

      ...currentPlayer,

      payment

    };


    const patch = {

      updatedAt:
        serverTimestamp()

    };


    if(role === "woman"){

      patch.woman =
        updatedPlayer;


      /*
       * Compatibilité avec les anciennes
       * données utilisant player1.
       */

      if(team.player1){

        patch.player1 =
          updatedPlayer;

      }

    }

    else{

      patch.man =
        updatedPlayer;


      /*
       * Compatibilité avec les anciennes
       * données utilisant player2.
       */

      if(team.player2){

        patch.player2 =
          updatedPlayer;

      }

    }


    await updateDoc(

      doc(
        db,
        "events",
        EVENT_ID,
        "teams",
        teamId
      ),

      patch

    );

  }


  /* ========================================
     LISTENER GLOBAL ÉQUIPES
  ======================================== */

  onSnapshot(

    teamsRef,

    snapshot => {

      const rows =
        snapshot.docs.map(
          documentSnapshot => ({

            id:
              documentSnapshot.id,

            ...documentSnapshot.data()

          })
        );


      teamsCache =
        rows;


      updateTeamCounters(
        rows
      );


      renderPayments(
        rows
      );

    },

    error => {

      console.error(
        error
      );


      countTotal.textContent =
        "—";


      countConfirmed.textContent =
        "—";


      countRemaining.textContent =
        "—";


      unpaidCount.textContent =
        "—";


      cashCount.textContent =
        "—";


      cbCount.textContent =
        "—";


      paymentList.innerHTML = `
        <div class="payment-empty">
          Erreur de chargement des paiements.
        </div>
      `;

    }

  );


  /* ========================================
     CHANGEMENT D'ONGLET INSCRITS
  ======================================== */

  tabTeams.addEventListener(
    "click",
    () => {

      currentTab =
        "teams";


      startMainListener();

    }
  );


  tabProfiles.addEventListener(
    "click",
    () => {

      currentTab =
        "profiles";


      startMainListener();

    }
  );


  tabInvites.addEventListener(
    "click",
    () => {

      currentTab =
        "invites";


      startMainListener();

    }
  );


  /* ========================================
     MISE À JOUR ÉLÉMENT INSCRITS
  ======================================== */

  async function updateItem(
    id,
    patch
  ){

    let reference;


    if(currentTab === "profiles"){

      reference =
        doc(
          db,
          "events",
          EVENT_ID,
          "partnerProfiles",
          id
        );

    }

    else if(currentTab === "invites"){

      reference =
        doc(
          db,
          "events",
          EVENT_ID,
          "teamInvitations",
          id
        );

    }

    else{

      reference =
        doc(
          db,
          "events",
          EVENT_ID,
          "teams",
          id
        );

    }


    await updateDoc(

      reference,

      {

        ...patch,

        updatedAt:
          serverTimestamp()

      }

    );

  }


  /* ========================================
     ACTIONS CARTES INSCRITS
  ======================================== */

  itemsList.addEventListener(

    "click",

    async event => {

      const button =
        event.target.closest(
          "button[data-action]"
        );


      if(!button){
        return;
      }


      const action =
        button.dataset.action;


      const id =
        button.dataset.id;


      button.disabled =
        true;


      try{

        if(action === "confirm"){

          await updateItem(
            id,
            {
              status:"confirmed"
            }
          );

        }


        else if(action === "registered"){

          await updateItem(
            id,
            {
              status:"registered"
            }
          );

        }


        else if(action === "profile-active"){

          await updateItem(
            id,
            {
              status:"active",
              closedReason:null
            }
          );

        }


        else if(action === "profile-closed"){

          await updateItem(
            id,
            {
              status:"closed",
              closedReason:"admin"
            }
          );

        }


        else if(action === "invite-pending"){

          await updateItem(
            id,
            {
              status:"pending"
            }
          );

        }


        else if(action === "invite-accepted"){

          await updateItem(
            id,
            {
              status:"accepted"
            }
          );

        }


        else if(action === "invite-refused"){

          await updateItem(
            id,
            {
              status:"refused"
            }
          );

        }

      }

      catch(error){

        console.error(
          error
        );


        alert(
          "Action impossible."
        );

      }

      finally{

        button.disabled =
          false;

      }

    }

  );


  /* ========================================
     ACTIONS PAIEMENTS
  ======================================== */

  paymentList.addEventListener(

    "click",

    async event => {

      const button =
        event.target.closest(
          "button[data-payment-action]"
        );


      if(!button){
        return;
      }


      const payment =
        button.dataset.paymentAction;


      const teamId =
        button.dataset.teamId;


      const role =
        button.dataset.role;


      const row =
        button.closest(
          ".payment-row"
        );


      const buttons =
        row
          ? row.querySelectorAll(
              ".payment-action"
            )
          : [];


      buttons.forEach(
        element => {

          element.disabled =
            true;

        }
      );


      try{

        await updatePlayerPayment(
          teamId,
          role,
          payment
        );

      }

      catch(error){

        console.error(
          error
        );


        alert(
          "Impossible de modifier le paiement."
        );

      }

      finally{

        buttons.forEach(
          element => {

            element.disabled =
              false;

          }
        );

      }

    }

  );


  /* ========================================
     INITIALISATION
  ======================================== */

  showMainView(
    "registrations"
  );


  startMainListener();

</script>


</body>

</html>
