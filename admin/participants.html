<!doctype html>

<html lang="fr">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#101010"
  >

  <title>
    Équipes | Administration BT250
  </title>


  <link
    rel="stylesheet"
    href="../assets/css/style.css"
  >


  <style>

    /* ========================================
       PAGE
    ======================================== */

    body{
      background:var(--sand-light);
    }


    .teams-admin-page{
      padding-top:8px;
      padding-bottom:26px;
    }


    /* ========================================
       COMPTEURS
    ======================================== */

    .teams-summary{
      display:grid;

      grid-template-columns:
        repeat(4,minmax(0,1fr));

      gap:6px;
    }


    .summary-box{
      min-width:0;

      padding:10px 4px;

      border-radius:14px;

      background:white;

      text-align:center;

      box-shadow:
        0 6px 18px
        rgba(0,0,0,.06);
    }


    .summary-box strong{
      display:block;

      color:#111;

      font-size:21px;

      line-height:1;

      font-weight:1000;
    }


    .summary-box span{
      display:block;

      margin-top:4px;

      color:#777;

      font-size:7px;

      font-weight:900;

      letter-spacing:.35px;

      text-transform:uppercase;
    }


    .summary-box.main strong{
      color:#126a35;
    }


    .summary-box.wait strong{
      color:#b47b00;
    }


    .summary-box.confirmed strong{
      color:var(--orange);
    }


    /* ========================================
       OUTILS
    ======================================== */

    .teams-tools{
      display:grid;

      grid-template-columns:
        1fr 1fr;

      gap:7px;

      margin-top:8px;
    }


    .tool-btn{
      min-height:41px;

      border:0;

      border-radius:11px;

      background:#111;

      color:white;

      font:inherit;

      font-size:10px;

      font-weight:950;

      cursor:pointer;
    }


    .tool-btn.secondary{
      background:#e9e9e9;
      color:#444;
    }


    /* ========================================
       EN-TÊTE LISTE
    ======================================== */

    .teams-list-head{
      display:flex;

      align-items:flex-end;
      justify-content:space-between;

      gap:10px;

      margin-top:14px;
      margin-bottom:7px;

      padding:0 2px;
    }


    .teams-list-kicker{
      color:var(--orange);

      font-size:8px;

      font-weight:950;

      letter-spacing:.8px;

      text-transform:uppercase;
    }


    .teams-list-head h2{
      margin:3px 0 0;

      color:#111;

      font-size:19px;

      line-height:1;

      font-weight:1000;
    }


    .teams-list-head p{
      margin:4px 0 0;

      color:#777;

      font-size:9px;

      line-height:1.3;

      font-weight:700;
    }


    .list-count{
      flex:0 0 auto;

      padding:5px 8px;

      border-radius:999px;

      background:#111;

      color:white;

      font-size:8px;

      font-weight:950;
    }


    /* ========================================
       LISTE
    ======================================== */

    .teams-list{
      display:grid;

      gap:7px;
    }


    /* ========================================
       CARTE ÉQUIPE
    ======================================== */

    .team-admin-card{
      padding:11px;

      border-radius:15px;

      background:white;

      border-left:
        4px solid #ddd;

      box-shadow:
        0 6px 18px
        rgba(0,0,0,.06);
    }


    .team-admin-card.confirmed{
      border-left-color:#25b864;
    }


    .team-admin-card.wait{
      border-left-color:#f0b429;
    }


    .team-admin-card.stby{
      border-left-color:#ff4b27;
    }


    .team-admin-card.deleted{
      border-left-color:#999;
    }


    /* ========================================
       TÊTE CARTE
    ======================================== */

    .team-card-head{
      display:flex;

      align-items:flex-start;
      justify-content:space-between;

      gap:9px;
    }


    .team-main{
      min-width:0;
    }


    .team-number{
      color:var(--orange);

      font-size:8px;

      font-weight:950;

      letter-spacing:.6px;

      text-transform:uppercase;
    }


    .team-name{
      margin-top:3px;

      color:#111;

      font-size:17px;

      line-height:1.05;

      font-weight:1000;

      word-break:break-word;
    }


    .team-meta{
      margin-top:5px;

      color:#888;

      font-size:9px;

      font-weight:750;

      line-height:1.4;
    }


    /* ========================================
       STATUT
    ======================================== */

    .team-status{
      flex:0 0 auto;

      padding:5px 8px;

      border-radius:999px;

      background:#eee;

      color:#666;

      font-size:8px;

      font-weight:950;

      text-transform:uppercase;
    }


    .team-status.confirmed{
      background:#ddf7e7;
      color:#126a35;
    }


    .team-status.wait{
      background:#fff3cd;
      color:#8a6500;
    }


    .team-status.stby{
      background:#fff0ec;
      color:#c83417;
    }


    .team-status.deleted{
      background:#ececec;
      color:#777;
    }


    /* ========================================
       JOUEURS
    ======================================== */

    .team-players{
      display:grid;

      grid-template-columns:
        1fr 1fr;

      gap:6px;

      margin-top:9px;
    }


    .player-box{
      min-width:0;

      padding:9px;

      border-radius:11px;

      background:#f3f3f3;
    }


    .player-role{
      display:block;

      margin-bottom:3px;

      color:#777;

      font-size:8px;

      font-weight:950;

      text-transform:uppercase;
    }


    .player-name{
      color:#111;

      font-size:11px;

      line-height:1.15;

      font-weight:1000;

      word-break:break-word;
    }


    .player-info{
      margin-top:4px;

      color:#777;

      font-size:8px;

      line-height:1.35;

      font-weight:750;
    }


    .rank-pill{
      display:inline-block;

      margin-top:5px;

      padding:3px 6px;

      border-radius:999px;

      background:#fff3cd;

      color:#8a6500;

      font-size:8px;

      font-weight:950;
    }


    /* ========================================
       ACTION RAPIDE
    ======================================== */

    .quick-actions{
      display:grid;

      grid-template-columns:
        1fr 1fr;

      gap:5px;

      margin-top:8px;
    }


    .quick-btn{
      min-width:0;

      min-height:37px;

      padding:5px;

      border:0;

      border-radius:9px;

      background:#f1f1f1;

      color:#555;

      font:inherit;

      font-size:9px;

      font-weight:950;

      cursor:pointer;
    }


    .quick-btn.green{
      background:#ddf7e7;
      color:#126a35;
    }


    .quick-btn.yellow{
      background:#fff3cd;
      color:#8a6500;
    }


    .quick-btn.orange{
      background:#fff0ec;
      color:#c83417;
    }


    .quick-btn.dark{
      background:#111;
      color:white;
    }


    .quick-btn.red{
      background:#ffe3de;
      color:#a52d18;
    }


    .quick-btn:disabled{
      opacity:.45;
    }


    /* ========================================
       PLUS D'ACTIONS
    ======================================== */

    .team-more{
      margin-top:8px;

      padding-top:8px;

      border-top:
        1px solid #eee;
    }


    .team-more summary{
      cursor:pointer;

      list-style:none;

      color:#888;

      font-size:9px;

      font-weight:900;

      user-select:none;
    }


    .team-more summary::-webkit-details-marker{
      display:none;
    }


    .secondary-actions{
      display:grid;

      grid-template-columns:
        repeat(2,minmax(0,1fr));

      gap:5px;

      margin-top:8px;
    }


    .secondary-btn{
      min-width:0;

      min-height:36px;

      padding:5px;

      border:0;

      border-radius:9px;

      background:#eee;

      color:#555;

      font:inherit;

      font-size:9px;

      font-weight:950;

      cursor:pointer;
    }


    .secondary-btn.red{
      background:#ffe3de;
      color:#a52d18;
    }


    .secondary-btn.green{
      background:#ddf7e7;
      color:#126a35;
    }


    .secondary-btn:disabled{
      opacity:.45;
    }


    /* ========================================
       CORBEILLE
    ======================================== */

    .trash-section{
      margin-top:18px;

      border-radius:17px;

      background:#fff;

      box-shadow:
        0 6px 18px
        rgba(0,0,0,.06);

      overflow:hidden;
    }


    .trash-section > summary{
      display:flex;

      align-items:center;
      justify-content:space-between;

      gap:10px;

      padding:13px 14px;

      cursor:pointer;

      list-style:none;

      user-select:none;
    }


    .trash-section > summary::-webkit-details-marker{
      display:none;
    }


    .trash-title{
      display:flex;

      align-items:center;

      gap:7px;

      color:#555;

      font-size:13px;

      font-weight:1000;
    }


    .trash-count{
      flex:0 0 auto;

      min-width:24px;

      padding:4px 7px;

      border-radius:999px;

      background:#ececec;

      color:#666;

      font-size:8px;

      font-weight:950;

      text-align:center;
    }


    .trash-section[open] > summary{
      border-bottom:
        1px solid #eee;
    }


    .trash-content{
      padding:8px;
    }


    .trash-list{
      display:grid;

      gap:7px;
    }


    .trash-empty{
      padding:18px 12px;

      color:#999;

      font-size:10px;

      font-weight:800;

      text-align:center;
    }


    .trash-actions{
      display:grid;

      grid-template-columns:
        1fr 1fr;

      gap:5px;

      margin-top:8px;
    }


    /* ========================================
       VIDE / ERREUR
    ======================================== */

    .teams-empty{
      padding:25px 15px;

      border-radius:16px;

      background:white;

      color:#777;

      font-size:11px;

      font-weight:800;

      text-align:center;

      box-shadow:
        0 6px 18px
        rgba(0,0,0,.05);
    }


    /* ========================================
       RESPONSIVE
    ======================================== */

    @media(max-width:350px){

      .teams-summary{
        grid-template-columns:
          repeat(2,minmax(0,1fr));
      }


      .team-players{
        grid-template-columns:1fr;
      }

    }


    @media(min-width:700px){

      .teams-list,
      .trash-list{
        grid-template-columns:
          repeat(2,minmax(0,1fr));
      }

    }

  </style>

</head>

<script type="module">

  /* ========================================
     SESSION
  ======================================== */

  import {
    requireAdmin
  } from "../assets/js/admin-session.js";


  if(!requireAdmin()){

    throw new Error(
      "Accès administrateur requis."
    );

  }


  /* ========================================
     FIREBASE
  ======================================== */

  import {
    db
  } from "../assets/js/firebase.js";


  import {
    collection,
    doc,
    onSnapshot,
    updateDoc,
    deleteDoc,
    query,
    orderBy,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";


  /* ========================================
     CONFIGURATION
  ======================================== */

  const EVENT_ID =
    "suzini-bt250-mixte-2026-10-02";


  const MAX_TEAMS =
    12;


  const teamsRef =
    collection(
      db,
      "events",
      EVENT_ID,
      "teams"
    );


  /* ========================================
     ÉLÉMENTS
  ======================================== */

  const countTotal =
    document.getElementById(
      "countTotal"
    );


  const countMain =
    document.getElementById(
      "countMain"
    );


  const countWait =
    document.getElementById(
      "countWait"
    );


  const countConfirmed =
    document.getElementById(
      "countConfirmed"
    );


  const listCount =
    document.getElementById(
      "listCount"
    );


  const cardsList =
    document.getElementById(
      "cardsList"
    );


  const trashList =
    document.getElementById(
      "trashList"
    );


  const trashCount =
    document.getElementById(
      "trashCount"
    );


  const statusMsg =
    document.getElementById(
      "statusMsg"
    );


  const btnExpand =
    document.getElementById(
      "btnExpand"
    );


  const btnCollapse =
    document.getElementById(
      "btnCollapse"
    );


  /* ========================================
     ÉTAT
  ======================================== */

  let rows =
    [];


  /* ========================================
     OUTILS
  ======================================== */

  function esc(value){

    return String(
      value ?? ""
    )
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");

  }


  function fmt(value){

    const text =
      String(
        value ?? ""
      ).trim();


    return text || "—";

  }


  function toNum(value){

    if(
      value === null ||
      value === undefined ||
      value === ""
    ){

      return null;

    }


    const number =
      Number(
        String(value)
          .replace(",",".")
          .trim()
      );


    return Number.isFinite(number)
      ? number
      : null;

  }


  function itemRef(id){

    return doc(
      db,
      "events",
      EVENT_ID,
      "teams",
      id
    );

  }


  function isDeleted(row){

    return (
      row.status === "deleted" ||
      row.status === "cancelled" ||
      row.status === "refused"
    );

  }


  function isWait(row){

    return (
      row.list === "wait" ||
      row.publicList === "waiting" ||
      row.status === "waiting"
    );

  }


  function isStby(row){

    return (
      row.stby === true ||
      row.status === "stby"
    );

  }


  function isConfirmed(row){

    return (
      row.status === "confirmed"
    );

  }


  function fullName(player){

    return (
      `${player?.prenom || ""} ${player?.nom || ""}`
        .trim() ||
      "—"
    );

  }


  function playerRank(
    player,
    fallback
  ){

    return toNum(
      player?.rank ??
      fallback
    );

  }


  function rankingValue(row){

    const woman =
      row.woman ||
      row.player1 ||
      {};


    const man =
      row.man ||
      row.player2 ||
      {};


    const womanRank =
      playerRank(
        woman,
        row.p1Rank
      );


    const manRank =
      playerRank(
        man,
        row.p2Rank
      );


    if(
      womanRank === null ||
      manRank === null
    ){

      return null;

    }


    return (
      womanRank +
      manRank
    );

  }


  /* ========================================
     STATUT
  ======================================== */

  function statusInfo(row){

    if(isDeleted(row)){

      return {
        className:"deleted",
        label:"Supprimée"
      };

    }


    if(isStby(row)){

      return {
        className:"stby",
        label:"STBY"
      };

    }


    if(isWait(row)){

      return {
        className:"wait",
        label:"Attente"
      };

    }


    if(isConfirmed(row)){

      return {
        className:"confirmed",
        label:"Confirmée"
      };

    }


    return {
      className:"registered",
      label:"Inscrite"
    };

  }


  /* ========================================
     CARTE ÉQUIPE
  ======================================== */

  function teamCard(
    row,
    index,
    trash = false
  ){

    const woman =
      row.woman ||
      row.player1 ||
      {};


    const man =
      row.man ||
      row.player2 ||
      {};


    const teamName =
      row.teamName ||
      `${woman.prenom || "Joueuse"} & ${man.prenom || "Joueur"}`;


    const womanRank =
      playerRank(
        woman,
        row.p1Rank
      );


    const manRank =
      playerRank(
        man,
        row.p2Rank
      );


    const teamRank =
      rankingValue(
        row
      );


    const state =
      statusInfo(
        row
      );


    return `

      <article
        class="
          team-admin-card
          ${esc(state.className)}
        "
        data-id="${esc(row.id)}"
      >


        <div class="team-card-head">


          <div class="team-main">


            <div class="team-number">

              ${
                trash
                  ? "Corbeille"
                  : `Équipe ${index + 1}`
              }

              ${
                teamRank !== null
                  ? ` · Rang ${esc(teamRank)}`
                  : ""
              }

            </div>


            <div class="team-name">
              ${esc(teamName)}
            </div>


            <div class="team-meta">

              Source :
              ${esc(
                row.source ||
                "inscription"
              )}

            </div>


          </div>


          <span
            class="
              team-status
              ${esc(state.className)}
            "
          >
            ${esc(state.label)}
          </span>


        </div>



        <div class="team-players">


          <div class="player-box">

            <span class="player-role">
              👩 Joueuse
            </span>


            <div class="player-name">
              ${esc(fullName(woman))}
            </div>


            <div class="player-info">

              Licence :
              ${esc(
                fmt(woman.licence)
              )}

            </div>


            <span class="rank-pill">

              BT :
              ${
                womanRank === null
                  ? "—"
                  : esc(womanRank)
              }

            </span>

          </div>


          <div class="player-box">

            <span class="player-role">
              👨 Joueur
            </span>


            <div class="player-name">
              ${esc(fullName(man))}
            </div>


            <div class="player-info">

              Licence :
              ${esc(
                fmt(man.licence)
              )}

            </div>


            <span class="rank-pill">

              BT :
              ${
                manRank === null
                  ? "—"
                  : esc(manRank)
              }

            </span>

          </div>


        </div>



        ${
          trash

            ? `

                <div class="trash-actions">


                  <button
                    class="quick-btn green"
                    data-action="restore"
                    data-id="${esc(row.id)}"
                    type="button"
                  >
                    ↩️ Restaurer
                  </button>


                  <button
                    class="quick-btn red"
                    data-action="destroy"
                    data-id="${esc(row.id)}"
                    type="button"
                  >
                    🗑️ Supprimer définitivement
                  </button>


                </div>

              `

            : `

                <div class="quick-actions">


                  <button
                    class="quick-btn green"
                    data-action="confirm"
                    data-id="${esc(row.id)}"
                    type="button"
                  >
                    ✓ Confirmer
                  </button>


                  <button
                    class="quick-btn ${
                      isWait(row)
                        ? "dark"
                        : "yellow"
                    }"
                    data-action="${
                      isWait(row)
                        ? "main"
                        : "wait"
                    }"
                    data-id="${esc(row.id)}"
                    type="button"
                  >
                    ${
                      isWait(row)
                        ? "↩️ Liste principale"
                        : "⏳ Liste d'attente"
                    }
                  </button>


                </div>



                <details class="team-more">


                  <summary>
                    ⚙️ Modifier / autres actions
                  </summary>


                  <div class="secondary-actions">


                    <button
                      class="secondary-btn"
                      data-action="edit"
                      data-id="${esc(row.id)}"
                      type="button"
                    >
                      ✏️ Modifier équipe
                    </button>


                    <button
                      class="secondary-btn"
                      data-action="rank"
                      data-id="${esc(row.id)}"
                      type="button"
                    >
                      🏆 Classements BT
                    </button>


                    <button
                      class="secondary-btn"
                      data-action="stby"
                      data-id="${esc(row.id)}"
                      type="button"
                    >
                      ${
                        isStby(row)
                          ? "▶️ Réactiver"
                          : "⏸️ STBY"
                      }
                    </button>


                    <button
                      class="secondary-btn red"
                      data-action="delete"
                      data-id="${esc(row.id)}"
                      type="button"
                    >
                      🗑️ Corbeille
                    </button>


                  </div>


                </details>

              `
        }


      </article>

    `;

  }


  /* ========================================
     TRI
  ======================================== */

  function sortRows(list){

    return [
      ...list
    ].sort(
      (a,b) => {


        function priority(row){

          if(isStby(row)){
            return 3;
          }


          if(isWait(row)){
            return 2;
          }


          return 1;

        }


        const priorityDiff =
          priority(a) -
          priority(b);


        if(priorityDiff !== 0){

          return priorityDiff;

        }


        const rankA =
          rankingValue(a);


        const rankB =
          rankingValue(b);


        if(
          rankA !== null &&
          rankB !== null &&
          rankA !== rankB
        ){

          return rankA - rankB;

        }


        if(
          rankA !== null &&
          rankB === null
        ){

          return -1;

        }


        if(
          rankA === null &&
          rankB !== null
        ){

          return 1;

        }


        const timeA =
          a.createdAt?.seconds ||
          0;


        const timeB =
          b.createdAt?.seconds ||
          0;


        return timeA - timeB;

      }
    );

  }


  /* ========================================
     AFFICHAGE
  ======================================== */

  function render(){

    const activeRows =
      rows.filter(
        row =>
          !isDeleted(row)
      );


    const deletedRows =
      rows.filter(
        row =>
          isDeleted(row)
      );


    const mainRows =
      activeRows.filter(
        row =>
          !isWait(row) &&
          !isStby(row)
      );


    const waitRows =
      activeRows.filter(
        row =>
          isWait(row)
      );


    const confirmedRows =
      activeRows.filter(
        row =>
          isConfirmed(row)
      );


    countTotal.textContent =
      String(
        activeRows.length
      );


    countMain.textContent =
      String(
        mainRows.length
      );


    countWait.textContent =
      String(
        waitRows.length
      );


    countConfirmed.textContent =
      String(
        confirmedRows.length
      );


    listCount.textContent =
      `${mainRows.length} / ${MAX_TEAMS}`;


    trashCount.textContent =
      String(
        deletedRows.length
      );


    const orderedActive =
      sortRows(
        activeRows
      );


    cardsList.innerHTML =
      orderedActive.length

        ? orderedActive
            .map(
              (row,index) =>
                teamCard(
                  row,
                  index,
                  false
                )
            )
            .join("")

        : `
            <div class="teams-empty">
              Aucune équipe inscrite.
            </div>
          `;


    const orderedDeleted =
      [...deletedRows]
        .sort(
          (a,b) => {

            const timeA =
              a.deletedAt?.seconds ||
              a.createdAt?.seconds ||
              0;


            const timeB =
              b.deletedAt?.seconds ||
              b.createdAt?.seconds ||
              0;


            return timeB - timeA;

          }
        );


    trashList.innerHTML =
      orderedDeleted.length

        ? orderedDeleted
            .map(
              (row,index) =>
                teamCard(
                  row,
                  index,
                  true
                )
            )
            .join("")

        : `
            <div class="trash-empty">
              La corbeille est vide.
            </div>
          `;


    if(mainRows.length >= MAX_TEAMS){

      statusMsg.textContent =
        `Tableau principal complet · ${mainRows.length} / ${MAX_TEAMS} équipes.`;

    }

    else{

      const remaining =
        MAX_TEAMS -
        mainRows.length;


      statusMsg.textContent =
        `${mainRows.length} équipe(s) en liste principale · ${remaining} place(s) disponible(s).`;

    }

  }


  /* ========================================
     FIRESTORE
  ======================================== */

  onSnapshot(

    query(
      teamsRef,
      orderBy(
        "createdAt",
        "asc"
      )
    ),

    snapshot => {

      rows =
        snapshot.docs.map(
          documentSnapshot => ({

            id:
              documentSnapshot.id,

            ...documentSnapshot.data()

          })
        );


      render();

    },


    error => {

      console.error(
        error
      );


      statusMsg.textContent =
        "Impossible de charger les équipes.";


      cardsList.innerHTML = `
        <div class="teams-empty">
          Erreur de chargement.
        </div>
      `;

    }

  );


  /* ========================================
     MODIFICATION FIRESTORE
  ======================================== */

  async function patchItem(
    id,
    patch
  ){

    await updateDoc(

      itemRef(id),

      {
        ...patch,

        updatedAt:
          serverTimestamp()
      }

    );

  }


  /* ========================================
     MODIFIER UNE ÉQUIPE
  ======================================== */

  async function editTeam(row){

    const woman =
      row.woman ||
      row.player1 ||
      {};


    const man =
      row.man ||
      row.player2 ||
      {};


    const womanFirstName =
      prompt(
        "Joueuse — Prénom :",
        woman.prenom || ""
      );


    if(womanFirstName === null){
      return;
    }


    const womanLastName =
      prompt(
        "Joueuse — Nom :",
        woman.nom || ""
      );


    if(womanLastName === null){
      return;
    }


    const womanLicence =
      prompt(
        "Joueuse — Licence :",
        woman.licence || ""
      );


    if(womanLicence === null){
      return;
    }


    const manFirstName =
      prompt(
        "Joueur — Prénom :",
        man.prenom || ""
      );


    if(manFirstName === null){
      return;
    }


    const manLastName =
      prompt(
        "Joueur — Nom :",
        man.nom || ""
      );


    if(manLastName === null){
      return;
    }


    const manLicence =
      prompt(
        "Joueur — Licence :",
        man.licence || ""
      );


    if(manLicence === null){
      return;
    }


    const newWoman = {

      ...woman,

      prenom:
        womanFirstName.trim(),

      nom:
        womanLastName.trim(),

      licence:
        womanLicence.trim(),

      sexe:
        "F"

    };


    const newMan = {

      ...man,

      prenom:
        manFirstName.trim(),

      nom:
        manLastName.trim(),

      licence:
        manLicence.trim(),

      sexe:
        "H"

    };


    await patchItem(

      row.id,

      {
        teamName:
          `${newWoman.prenom} & ${newMan.prenom}`,

        woman:
          newWoman,

        man:
          newMan,

        player1:
          newWoman,

        player2:
          newMan
      }

    );

  }


  /* ========================================
     CLASSEMENTS BT
  ======================================== */

  async function editRanks(row){

    const woman =
      row.woman ||
      row.player1 ||
      {};


    const man =
      row.man ||
      row.player2 ||
      {};


    const womanInput =
      prompt(
        `Classement BT de ${woman.prenom || "la joueuse"} :`,
        woman.rank ??
        row.p1Rank ??
        ""
      );


    if(womanInput === null){
      return;
    }


    const manInput =
      prompt(
        `Classement BT de ${man.prenom || "le joueur"} :`,
        man.rank ??
        row.p2Rank ??
        ""
      );


    if(manInput === null){
      return;
    }


    const womanRank =
      womanInput.trim() === ""
        ? null
        : toNum(
            womanInput
          );


    const manRank =
      manInput.trim() === ""
        ? null
        : toNum(
            manInput
          );


    if(
      womanInput.trim() !== "" &&
      womanRank === null
    ){

      alert(
        "Classement joueuse invalide."
      );

      return;

    }


    if(
      manInput.trim() !== "" &&
      manRank === null
    ){

      alert(
        "Classement joueur invalide."
      );

      return;

    }


    const newWoman = {

      ...woman,

      rank:
        womanRank

    };


    const newMan = {

      ...man,

      rank:
        manRank

    };


    await patchItem(

      row.id,

      {
        woman:
          newWoman,

        man:
          newMan,

        player1:
          newWoman,

        player2:
          newMan,

        p1Rank:
          womanRank,

        p2Rank:
          manRank
      }

    );

  }


  /* ========================================
     ACTIONS SUR LES ÉQUIPES
  ======================================== */

  async function handleAction(
    button
  ){

    const id =
      button.dataset.id;


    const action =
      button.dataset.action;


    const row =
      rows.find(
        item =>
          item.id === id
      );


    if(!row){

      return;

    }


    button.disabled =
      true;


    try{


      /* ==================================
         CONFIRMER
      ================================== */

      if(action === "confirm"){

        await patchItem(

          id,

          {
            status:
              "confirmed",

            list:
              "main",

            publicList:
              "main",

            stby:
              false
          }

        );

      }


      /* ==================================
         LISTE PRINCIPALE
      ================================== */

      else if(action === "main"){

        const currentMainCount =
          rows.filter(
            item =>
              item.id !== id &&
              !isDeleted(item) &&
              !isWait(item) &&
              !isStby(item)
          ).length;


        if(
          currentMainCount >=
          MAX_TEAMS
        ){

          alert(
            `La liste principale contient déjà ${MAX_TEAMS} équipes.`
          );

          return;

        }


        await patchItem(

          id,

          {
            list:
              "main",

            publicList:
              "main",

            stby:
              false,

            status:
              isConfirmed(row)
                ? "confirmed"
                : "registered"
          }

        );

      }


      /* ==================================
         LISTE D'ATTENTE
      ================================== */

      else if(action === "wait"){

        await patchItem(

          id,

          {
            list:
              "wait",

            publicList:
              "waiting",

            stby:
              false
          }

        );

      }


      /* ==================================
         STBY
      ================================== */

      else if(action === "stby"){

        if(isStby(row)){

          const currentMainCount =
            rows.filter(
              item =>
                item.id !== id &&
                !isDeleted(item) &&
                !isWait(item) &&
                !isStby(item)
            ).length;


          if(
            currentMainCount >=
            MAX_TEAMS
          ){

            alert(
              `La liste principale contient déjà ${MAX_TEAMS} équipes.`
            );

            return;

          }

        }


        await patchItem(

          id,

          {
            stby:
              !isStby(row)
          }

        );

      }


      /* ==================================
         MODIFIER
      ================================== */

      else if(action === "edit"){

        await editTeam(
          row
        );

      }


      /* ==================================
         CLASSEMENTS
      ================================== */

      else if(action === "rank"){

        await editRanks(
          row
        );

      }


      /* ==================================
         VERS LA CORBEILLE
      ================================== */

      else if(action === "delete"){

        const teamLabel =
          row.teamName ||
          "Équipe";


        const ok =
          confirm(
            `Placer l'équipe "${teamLabel}" dans la corbeille ?`
          );


        if(!ok){

          return;

        }


        await patchItem(

          id,

          {
            status:
              "deleted",

            deletedAt:
              serverTimestamp()
          }

        );

      }


      /* ==================================
         RESTAURATION
      ================================== */

      else if(action === "restore"){

        const currentMainCount =
          rows.filter(
            item =>
              item.id !== id &&
              !isDeleted(item) &&
              !isWait(item) &&
              !isStby(item)
          ).length;


        const mainIsFull =
          currentMainCount >=
          MAX_TEAMS;


        await patchItem(

          id,

          {
            status:
              "registered",

            list:
              mainIsFull
                ? "wait"
                : "main",

            publicList:
              mainIsFull
                ? "waiting"
                : "main",

            stby:
              false,

            deletedAt:
              null
          }

        );

      }


      /* ==================================
         SUPPRESSION DÉFINITIVE
      ================================== */

      else if(action === "destroy"){

        const teamLabel =
          row.teamName ||
          "Équipe";


        const firstConfirm =
          confirm(
            `Supprimer définitivement l'équipe "${teamLabel}" ?\n\nCette action est irréversible.`
          );


        if(!firstConfirm){

          return;

        }


        const secondConfirm =
          confirm(
            `Dernière confirmation : supprimer définitivement "${teamLabel}" de la base de données ?`
          );


        if(!secondConfirm){

          return;

        }


        await deleteDoc(
          itemRef(id)
        );

      }


    }

    catch(error){

      console.error(
        error
      );


      if(
        action === "destroy" &&
        error?.code ===
          "permission-denied"
      ){

        alert(
          "Suppression définitive refusée par les règles Firestore. Il faut autoriser la suppression des équipes dans les règles de la base."
        );

      }

      else{

        alert(
          "Action impossible."
        );

      }

    }

    finally{

      button.disabled =
        false;

    }

  }


  cardsList.addEventListener(

    "click",

    async event => {

      const button =
        event.target.closest(
          "button[data-action]"
        );


      if(!button){

        return;

      }


      await handleAction(
        button
      );

    }

  );


  trashList.addEventListener(

    "click",

    async event => {

      const button =
        event.target.closest(
          "button[data-action]"
        );


      if(!button){

        return;

      }


      await handleAction(
        button
      );

    }

  );


  /* ========================================
     DÉVELOPPER / RÉDUIRE
  ======================================== */

  btnExpand.addEventListener(
    "click",
    () => {

      document
        .querySelectorAll(
          "#cardsList .team-more"
        )
        .forEach(
          detail => {

            detail.open =
              true;

          }
        );

    }
  );


  btnCollapse.addEventListener(
    "click",
    () => {

      document
        .querySelectorAll(
          "#cardsList .team-more"
        )
        .forEach(
          detail => {

            detail.open =
              false;

          }
        );

    }
  );

</script>
